[gcode_macro FAST_MOVE_HOME]
gcode:
 G1 Z2 F5000
 G1 X5 Y-3 F100000
 G1 Z0.4 F5000

[gcode_macro G80]
gcode:
 BED_MESH_CALIBRATE
 FAST_MOVE_HOME

[gcode_macro G81]
gcode:
 BED_MESH_OUTPUT

[z_tilt]
z_positions:
 -30,105
 280,105
points:
 215,1
 215,96
 215,193
 5,193
 5,96
 5,1
speed: 500
horizontal_move_z: 5.0

[homing_override]
# X/Y now home at full run_current. Autotune derives chopper hysteresis, PWM_OFS
# and the CoolStep window from run_current ONCE at klippy:ready and never
# recomputes, so dropping current mid-homing left the driver running a chopper
# tuned for a current it was not at -- which perturbs the StallGuard that
# sensorless X/Y homing depends on. SGT now lives in bear_autotune.cfg.
gcode:
 G1 Z2

 G91
 M117 Homing X
 G28 X0
 G1 X10 F10000

 M117 Homing Y
 G28 Y0
 G1 Y10 F10000
 G90

 M117 Homing Z
 G1 x153 Y132 F100000
 G28 Z0

 M117 Leveling Gantry
 Z_TILT_ADJUST

 M117 Homing Z
 G1 Z2
 G1 x101 y100 F100000
 G28 Z0
 FAST_MOVE_HOME
axes: Z
set_position_x: 0
set_position_y: 0
set_position_z: 0


[probe]
pin: PG15
x_offset: 24
y_offset: 5
speed: 10.0
samples: 3
sample_retract_dist: 3
samples_tolerance_retries: 3
