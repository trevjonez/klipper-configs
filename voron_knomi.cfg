
[gcode_macro _KNOMI_STATUS]
# Klipper status refresh period to use while the KNOMI is animating, seconds.
# Stock is 0.25, which caps the animation at ~3.5Hz because that is the rate
# the data comes into existence, not a transport limit. See _KNOMI_QUERY_RATE.
#
# 0.10 is the measured knee, not a guess. KNOMI request rate against klippy
# CPU on this machine:
#
#     tick    KNOMI      klippy CPU
#     0.25    3.00/s     14.1%   (stock)
#     0.15    5.42/s     18.3%
#     0.10    6.75/s     20.4%   <- more than double the rate for +45% cpu
#     0.05    7.75/s     24.9%   <- +15% more rate for another +22% cpu
#
# Below ~0.10 Klipper generates ticks the KNOMI cannot consume: the device
# needs ~110ms per cycle of its own (TCP connect per request, HTTP, JSON
# parse), which the 250ms tick used to hide.
variable_animate_period = 0.10
variable_homing = False
variable_probing = False
variable_qgling = False
variable_heating_nozzle = False
variable_heating_bed = False
gcode = 

# Raise Klipper's status refresh rate while the KNOMI is showing an animated
# state, and put it back when it is not.
#
# Derived from the flags rather than paired set/reset calls, because these
# operations nest: QUAD_GANTRY_LEVEL homes on the way in if the machine is not
# homed, and the inner G28's reset would otherwise drop the rate back to 0.25
# while the outer level is still running. Recomputing from the flags is
# idempotent, so it does not matter how many times or in what order it runs.
[gcode_macro _KNOMI_QUERY_RATE]
gcode:
	{% set k = printer['gcode_macro _KNOMI_STATUS'] %}
	{% if k.homing or k.probing or k.qgling %}
	  SET_QUERY_REFRESH PERIOD={k.animate_period}
	{% else %}
	  SET_QUERY_REFRESH RESET=1
	{% endif %}

[gcode_macro M109]
rename_existing = M109.1
gcode = 
	status_heating
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
	M109.1 {rawparams}
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False
	status_ready

[gcode_macro M190]
rename_existing = M190.1
gcode: 
	status_heating
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
	M190.1 {rawparams}
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False
	status_ready

[gcode_macro G28]
rename_existing = G28.1
gcode: 
	status_homing
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
	_KNOMI_QUERY_RATE
	G28.1 {rawparams}
	# The Eddy's tap (PROBE METHOD=tap + SET_Z_FROM_PROBE) used to run here.
	# Z-zero is now CARTOGRAPHER_TOUCH_HOME inside voron.cfg's homing_override.
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
	_KNOMI_QUERY_RATE
	status_ready

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
	SET_GCODE_OFFSET_ORIG { rawparams }

# Passes the caller's parameters through. It used to discard them and always run
# `METHOD=scan HORIZONTAL_MOVE_Z=1`, which is why the Eddy-era METHOD=rapid_scan
# "mitigation" in G32/START_PRINT never actually took effect (found 2026-09-25).
# The wrapped command is now the Cartographer plugin's BED_MESH_CALIBRATE, which
# takes over Klipper's at config load; this rename runs later (klippy:connect).
[gcode_macro BED_MESH_CALIBRATE]
rename_existing = BTT_BED_MESH_CALIBRATE
gcode: 
	status_meshing
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
	_KNOMI_QUERY_RATE
	BTT_BED_MESH_CALIBRATE {rawparams}
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
	_KNOMI_QUERY_RATE
	status_ready

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing = BTT_QUAD_GANTRY_LEVEL
gcode: 
	status_leveling
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
	_KNOMI_QUERY_RATE
	BTT_QUAD_GANTRY_LEVEL {rawparams}
	SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
	_KNOMI_QUERY_RATE
	status_ready

# The KNOMI reads these to animate homing against the real machine.
#
# It has to guess where the toolhead is while an axis is unhomed, and the
# guess is only as good as knowing which way that axis travels and how fast.
# Rather than baking those into the display's firmware -- where changing
# printer.cfg would mean a reflash -- they are published here, derived from
# the live config at startup. Edit printer.cfg, restart Klipper, and the
# KNOMI picks the new values up on its next poll.
#
# If this macro is absent the KNOMI falls back to compiled-in defaults, so
# nothing breaks by not having it.
[gcode_macro _KNOMI_HOME_INFO]
variable_ready: False
variable_x_home: 0.0     # position_endstop -- where the axis lands when homed
variable_y_home: 0.0
variable_x_speed: 0.0    # homing_speed, mm/s
variable_y_speed: 0.0
variable_z_speed: 0.0
gcode:

[delayed_gcode _KNOMI_HOME_INFO_INIT]
initial_duration: 2
gcode:
	{% set cf = printer.configfile.settings %}
	{% set sx = cf['stepper_x'] %}
	{% set sy = cf['stepper_y'] %}
	{% set sz = cf['stepper_z'] %}
	# position_endstop is absent on a probe-homed axis (Z here), and
	# homing_speed has a Klipper default, so every read is guarded.
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=x_home VALUE={sx.get('position_endstop', sx.get('position_max', 0.0))|float}
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=y_home VALUE={sy.get('position_endstop', sy.get('position_max', 0.0))|float}
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=x_speed VALUE={sx.get('homing_speed', 5.0)|float}
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=y_speed VALUE={sy.get('homing_speed', 5.0)|float}
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=z_speed VALUE={sz.get('homing_speed', 5.0)|float}
	SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=ready VALUE=True

# Lets a macro shorten Klipper's status refresh period for the span of an
# operation worth animating smoothly, then put it back. See
# klippy_extras/knomi_query_refresh.py for what it does and why it cannot be a
# gcode_macro. The .py must be symlinked into klipper/klippy/extras/:
#
#   ln -sf ~/klipper-configs/klippy_extras/knomi_query_refresh.py \
#          ~/klipper/klippy/extras/
[knomi_query_refresh]
