########################################################################
# FIRST_LAYER_WIDTH_TEST
#
# Prints a row of solid single-layer squares, each one STEP% wider than
# the last, so first-layer extrusion width can be judged by eye instead
# of guessed. Square 1 is START%, square 2 is START+STEP%, and so on;
# the console prints the mapping before it starts.
#
# Width here is a percentage of the nozzle diameter, matching how the
# slicers express it (PrusaSlicer first_layer_extrusion_width,
# OrcaSlicer initial_layer_line_width). Pick the square whose infill
# lines have just merged with no ridging or gaps, and set that
# percentage in the slicer profile.
#
# Extrusion is the rounded-rectangle model the slicers use --
# area = h*(w-h) + pi*(h/2)^2 -- not w*h, which over-extrudes by ~15%
# at these widths and would bias the whole test.
#
# Reuses START_PRINT (home, QGL, soak, hot rapid_scan mesh, heat) and
# END_PRINT (park) so it behaves like any other print on this machine.
# PRIME_LINE is called separately because START_PRINT has it commented
# out -- the slicer's start gcode primes after the MMU load, and this
# macro has to do the same or the first square starts on a nozzle that
# has been drooling through the whole mesh cycle.
#
# Filament must already be loaded (MMU gate or bypass); this does not
# drive the MMU.
#
# Progress: M73 drives display_status.progress and SET_PRINT_STATS_INFO
# fills the layer counters, so the UI shows a bar and "square n of N".
# print_stats.state stays `standby` regardless -- that field is owned by
# virtual_sdcard and only a real file print sets it, so this cannot be
# made to read "Printing" from a macro. Squares are counted as layers
# because that is the only counter the UI exposes.
#
# BED_TEMP, EXTRUDER_TEMP and PRESSURE_ADVANCE are required and have no
# defaults on purpose: all three change what the extrusion looks like, and
# a forgotten default would quietly test the wrong thing. `|float` on a
# missing param yields 0.0 rather than failing, so they are checked
# explicitly before anything heats.
#
#   FIRST_LAYER_WIDTH_TEST BED_TEMP=100 EXTRUDER_TEMP=255 PRESSURE_ADVANCE=0.0465
#   FIRST_LAYER_WIDTH_TEST BED_TEMP=100 EXTRUDER_TEMP=255 PRESSURE_ADVANCE=0.0465 START=105 COUNT=5
########################################################################
[gcode_macro FIRST_LAYER_WIDTH_TEST]
description: Row of solid squares stepping first-layer extrusion width
gcode:
    {% set size   = params.SIZE|default(20)|float %}
    {% set gap    = params.GAP|default(5)|float %}
    {% set count  = params.COUNT|default(6)|int %}
    {% set start  = params.START|default(100)|float %}
    {% set step   = params.STEP|default(5)|float %}
    {% set h      = params.HEIGHT|default(0.2)|float %}
    {% set fr     = (params.SPEED|default(50)|float) * 60 %}

    {% for r in ['BED_TEMP', 'EXTRUDER_TEMP', 'PRESSURE_ADVANCE'] %}
        {% if r not in params %}
            { action_raise_error("FIRST_LAYER_WIDTH_TEST: %s is required (no default -- it changes what the test measures)" | format(r)) }
        {% endif %}
    {% endfor %}
    {% set bed    = params.BED_TEMP|float %}
    {% set noz    = params.EXTRUDER_TEMP|float %}
    {% set pa     = params.PRESSURE_ADVANCE|float %}

    {% set e      = printer.configfile.settings.extruder %}
    {% set nd     = e.nozzle_diameter|float %}
    {% set fa     = 3.14159265 * (e.filament_diameter|float / 2) ** 2 %}

    {% set span   = count * size + (count - 1) * gap %}
    {% set xmax   = printer.toolhead.axis_maximum.x|float %}
    {% set ymax   = printer.toolhead.axis_maximum.y|float %}

    {% if span > xmax - 20 %}
        { action_raise_error("FIRST_LAYER_WIDTH_TEST: %d squares of %.0fmm need %.0fmm of X, bed is %.0fmm"
                             | format(count, size, span, xmax)) }
    {% endif %}
    {% if nd * start / 100.0 < h %}
        { action_raise_error("FIRST_LAYER_WIDTH_TEST: START=%.0f%% gives a %.2fmm line, narrower than the %.2fmm layer"
                             | format(start, nd * start / 100.0, h)) }
    {% endif %}

    {% set x0 = (xmax - span) / 2.0 %}
    {% set y0 = (ymax - size) / 2.0 %}

    {% set pa_was = printer.extruder.pressure_advance|float %}
    { action_respond_info("FIRST_LAYER_WIDTH_TEST: %d squares, %.2fmm layer, nozzle %.2fmm, PA %.4f" | format(count, h, nd, pa)) }
    {% for i in range(count) %}
        { action_respond_info("  square %d (x=%.0f): %.0f%% = %.3fmm"
                              | format(i + 1, x0 + i * (size + gap) + size / 2.0,
                                       start + i * step, nd * (start + i * step) / 100.0)) }
    {% endfor %}

    SET_PRINT_STATS_INFO TOTAL_LAYER={count} CURRENT_LAYER=0
    M73 P0
    SET_DISPLAY_TEXT MSG="Width test: home, soak, mesh"
    START_PRINT BED_TEMP={bed} EXTRUDER_TEMP={noz} FIRST_Z={h}
    status_cleaning
    PRIME_LINE FIRST_Z={h|round(3)}
    status_printing

    SET_PRESSURE_ADVANCE ADVANCE={pa}

    M83
    G90
    G1 Z{h|round(3)} F600

    {% for i in range(count) %}
        {% set w    = nd * (start + i * step) / 100.0 %}
        {% set area = h * (w - h) + 3.14159265 * (h / 2.0) ** 2 %}
        {% set epm  = area / fa %}
        {% set sx   = x0 + i * (size + gap) %}

        ; ---- square {i + 1}: {(start + i * step)|round(0)}% = {w|round(3)}mm ----
        SET_PRINT_STATS_INFO CURRENT_LAYER={i + 1}
        M73 P{((i * 100) / count)|int}
        SET_DISPLAY_TEXT MSG="Width test {i + 1}/{count}: {(start + i * step)|round(0)}% = {w|round(3)}mm"
        G1 Z{(h + 0.6)|round(3)} F900
        G1 X{(sx + w / 2.0)|round(3)} Y{(y0 + w / 2.0)|round(3)} F9000
        G1 Z{h|round(3)} F600
        G1 E0.6 F1800

        {% set il = size - w %}
        G1 X{(sx + w / 2.0 + il)|round(3)} Y{(y0 + w / 2.0)|round(3)} E{(il * epm)|round(5)} F{fr}
        G1 X{(sx + w / 2.0 + il)|round(3)} Y{(y0 + w / 2.0 + il)|round(3)} E{(il * epm)|round(5)} F{fr}
        G1 X{(sx + w / 2.0)|round(3)} Y{(y0 + w / 2.0 + il)|round(3)} E{(il * epm)|round(5)} F{fr}
        G1 X{(sx + w / 2.0)|round(3)} Y{(y0 + w / 2.0)|round(3)} E{(il * epm)|round(5)} F{fr}

        {% set lines = ((il - w) / w)|int %}
        {% set ns = namespace(flip=false) %}
        {% for j in range(1, lines + 1) %}
            {% set y = y0 + w / 2.0 + j * w %}
            {% set xa = sx + w / 2.0 + (w if not ns.flip else il - w) %}
            {% set xb = sx + w / 2.0 + (il - w if not ns.flip else w) %}
            G1 X{xa|round(3)} Y{y|round(3)} E{((w)*epm)|round(5)} F{fr}
            G1 X{xb|round(3)} Y{y|round(3)} E{((xb - xa)|abs * epm)|round(5)} F{fr}
            {% set ns.flip = not ns.flip %}
        {% endfor %}

        G1 E-0.6 F1800
    {% endfor %}

    G1 Z{(h + 5)|round(3)} F900
    M73 P100
    SET_DISPLAY_TEXT MSG="Width test done: {count} squares, {start|round(0)}-{(start + (count - 1) * step)|round(0)}%"
    ; Put PA back so a calibration run does not silently change the next print.
    SET_PRESSURE_ADVANCE ADVANCE={pa_was}
    END_PRINT
