# TODO: adopt the Octopus Pro pin aliases once these machines are on current
# klipper. board_pins/octopus_pro_v1.0.cfg names every header as the silkscreen
# does (DRIVER0_STEP, STOP0, HE0, TB, FAN0 ...), and voron.cfg already uses it.
#
# Deferred on purpose: the three Bears run klipper v0.12.0-286 while the Voron
# is on v0.13.0-743, and they should be updated first -- a separate session.
#
# When adopting, note that fans_common.cfg is shared by all three Bears and is
# NOT included by voron.cfg. It still uses raw pins for exactly that reason:
# aliasing it before the Bears include board_pins/octopus_pro_v1.0.cfg would
# break all three at once. Convert the include and that file together.

[exclude_object]

[stepper_x]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 0
position_max: 250
homing_speed: 40 
homing_retract_dist: 0

[tmc5160 stepper_x]
#spi_bus: spi1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
cs_pin: PC6
run_current: .55
diag0_pin: ^!PG10
# driver_SGT: 2   # autotune owns SGT; value moved to sgt: in bear_autotune.cfg
interpolate: true
#stealthchop_threshold: 999999

[stepper_y]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: -4
position_max: 210
position_min: -4
homing_retract_dist: 0
homing_speed: 40

[tmc5160 stepper_y]
#spi_bus: spi1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
cs_pin: PC7
run_current: .55
diag0_pin: ^!PG11
# driver_SGT: 2   # autotune owns SGT; value moved to sgt: in bear_autotune.cfg
interpolate: true
#stealthchop_threshold: 999999

[stepper_z]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 8
rotation_distance: 2
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 208
position_min: -2
homing_speed: 5          # was 10. thigh sits at 6.30 mm/s, and Z homes on
                         # probe:z_virtual_endstop -- NOT a TMC virtual endstop --
                         # so Klipper TMCVirtualPinHelper skips it and does not
                         # zero thigh or drop StealthChop the way it does for the
                         # sensorless X/Y homing moves. At 10 mm/s Z crossed thigh
                         # mid-home and went fullstep/SpreadCycle every time.

[tmc5160 stepper_z]
#spi_bus: spi1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
cs_pin: PD11
run_current: .45
diag0_pin: ^!PG9
interpolate: true
# stealthchop_threshold: 999999   # autotune owns this now (tuning_goal: silent)

[stepper_z1]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 8
rotation_distance: 2
full_steps_per_rotation: 200

[tmc5160 stepper_z1]
#spi_bus: spi1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
cs_pin: PC4
run_current: .45
diag0_pin: ^!PG6
interpolate: true
# stealthchop_threshold: 999999   # autotune owns this now (tuning_goal: silent)

