dir_pin: PF10
enable_pin: !PG2
gear_ratio: 3:1
microsteps: 8
rotation_distance: 22.9768
full_steps_per_rotation: 400
filament_diameter: 1.750
max_extrude_cross_section: 50
max_extrude_only_distance: 5000.0
max_extrude_only_velocity: 500.0
max_extrude_only_accel: 5000.0
heater_pin: PA2
sensor_type: T-D500
sensor_pin: PF4
