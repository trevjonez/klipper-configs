max_temp: 305

[tmc5160 extruder]
#spi_bus: spi1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
cs_pin: PF2
run_current: .65
hold_current: .1
#diag0_pin: ^!PG12
# driver_SGT: 3   # inert (no sensorless homing on E); autotune owns SGT
#stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA1
sensor_pin: PF3
control: pid
min_temp: 0
max_temp: 120

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.25

[printer]
kinematics: cartesian
max_velocity: 350        # validated 2026-09-18 via TEST_SPEED at 200/250/300/350
                         # with ACCEL=4700, all clean by ear and by fault-free runs.
                         # NOTE the step-loss check in TEST_SPEED cannot resolve this
                         # machine: sensorless X/Y homing drifts ~0.64mm per home
                         # (Y delta was exactly 128 usteps on every run regardless of
                         # speed), which is 4x the macro l full-step threshold. So
                         # 350 means nothing objected, not a measured step-loss limit.
                         # Motors run at 0.55A of 1.68A rated, so torque margin -- not
                         # back-EMF (which does not bind until ~1240 mm/s) -- is what
                         # would actually cap this.
max_accel: 4700          # measured ceiling, set by the Y axis (X allows 14200)
max_z_velocity: 5
max_z_accel: 100

# Measured 2026-09-18 on mk3-1 with a FYSETC PIS (ADXL345): TEST_RESONANCES on
# each axis, fitted by scripts/calibrate_shaper.py. Shared across all three
# Bears deliberately -- they are mechanically identical, and even an imperfect
# match beats the hand-guessed values these replace (which had X and Y within
# 1 Hz of each other on a bed slinger, where they should differ a lot).
#
#   X  mzv @ 69.4 Hz   residual 0.1%   suggested max_accel 14200
#   Y  mzv @ 40.0 Hz   residual 0.0%   suggested max_accel  4700
#
# X is the light toolhead, Y drags the bed -- hence the 29 Hz spread. Both fit
# mzv at ~0% residual, i.e. single clean peaks with no secondary modes.
# Re-measure per machine if one starts ringing; the mounts differ, not the frame.
[input_shaper]
shaper_freq_x: 69.4
shaper_type_x: mzv
shaper_freq_y: 40.0
shaper_type_y: mzv

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus_Pro]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 100
