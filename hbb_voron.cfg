[mcu HBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621B056C7A-if00
restart_method: command

[temperature_sensor HBB]
sensor_type: temperature_mcu
sensor_mcu: HBB
min_temp: 10
max_temp: 100

[gcode_button key1]
pin: !HBB:gpio25
press_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0.4 BLUE=0 INDEX=1
  SET_GCODE_OFFSET Z_ADJUST=0.025
  {% set v = printer['gcode_macro _HBB_VARS'] %}
  G4 P100
  SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=1
release_gcode:

[gcode_button key2]
pin: !HBB:gpio26
press_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0.4 BLUE=0 INDEX=2
  SET_GCODE_OFFSET Z_ADJUST=-0.025
  {% set v = printer['gcode_macro _HBB_VARS'] %}
  G4 P100
  SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=2
release_gcode:
  
[gcode_button key3]
pin: !HBB:gpio27
press_gcode:
  _HBB_CYCLE_TEMP HEATER=drybox
  UPDATE_DELAYED_GCODE ID=_hbb_hold_drybox DURATION={printer['gcode_macro _HBB_VARS'].hold_secs}
release_gcode:
  UPDATE_DELAYED_GCODE ID=_hbb_hold_drybox DURATION=0

[gcode_button key4]
pin: !HBB:gpio19
press_gcode:
  _BUTTON_HOME
release_gcode:

[gcode_macro _BUTTON_HOME]
gcode:
  UPDATE_DELAYED_GCODE ID=_hbb_status_leds DURATION=1
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G90    
    status_homing
    G28
    status_leveling
    QUAD_GANTRY_LEVEL
    status_homing
    G28
    # PARK = MOVE_UP (current Z + 20, capped at stepper_z position_max) then
    # PARK_XY (X175 Y325), leaving the head high and clear. This replaced
    # PARK_PREHEAT, which parked low over the purge bucket at Z10 and became a
    # pointless traverse once PARK followed it.
    #
    # Note MOVE_UP is RELATIVE -- it adds 20 to wherever Z is after homing, not
    # an absolute height. PARK_SOAK is the absolute-Z100 option if a
    # deterministic height is ever wanted.
    PARK
  {% else %}
    M84
  {% endif %}

[delayed_gcode _hbb_status_leds]
initial_duration: 5.
gcode:
  # Colours come from _HBB_VARS, populated once by _hbb_cache_colours.
  # Do NOT read printer.configfile.settings here -- see that macro.
  {% set v = printer['gcode_macro _HBB_VARS'] %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    SET_LED LED=HBB_LED RED=0 GREEN=0.5 BLUE=0 INDEX=4
  {% else %}
    SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=4
  {% endif %}
  _HBB_HEATER_LEDS
  UPDATE_DELAYED_GCODE ID=_hbb_status_leds DURATION=5

[gcode_button key5]
pin: !HBB:gpio18
press_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=5 SYNC=0
  M112
release_gcode:

[gcode_button key6]
pin: !HBB:gpio13
press_gcode:
  _HBB_CYCLE_TEMP
  UPDATE_DELAYED_GCODE ID=_hbb_hold_nozzle DURATION={printer['gcode_macro _HBB_VARS'].hold_secs}
release_gcode:
  UPDATE_DELAYED_GCODE ID=_hbb_hold_nozzle DURATION=0

[gcode_button key7]
pin: !HBB:gpio12
press_gcode:
  _HBB_CYCLE_TEMP HEATER=bed
  UPDATE_DELAYED_GCODE ID=_hbb_hold_bed DURATION={printer['gcode_macro _HBB_VARS'].hold_secs}
release_gcode:
  UPDATE_DELAYED_GCODE ID=_hbb_hold_bed DURATION=0

# Long press -> straight to off.
#
# Klipper's gcode_button has no hold support, so it is built from the two edges
# it does give: the press acts immediately and arms a delayed_gcode; the release
# only cancels it. If the timer survives to fire, the button was still down.
#
# There is deliberately NO shared flag between press, release and timer. An
# earlier version had release check one, which was unreliable: button_callback
# renders the whole template BEFORE running any of it
#
#     commands = template.render()      # the {% if %} is decided here
#     self.gcode.run_script(commands)   # and only then does anything run
#
# so release decided its branch against whatever the flag happened to be at that
# instant, while the writes to it came from two other run_script calls going
# through a mutex-guarded queue. Near the threshold that is a race, and a stale
# flag from a previous hold made the next tap do nothing.
#
# Acting on the push edge instead means the other edge is a bare cancel --
# idempotent and order-independent. The cost is that a long press briefly steps
# to the next preset before going off, which is visible but harmless.
#
# The HBB buttons are wired active-low, so every pin here carries a '!'. Without
# it Klipper reads them backwards -- QUERY_BUTTON reports PRESSED with nothing
# touched, and release_gcode fires on a physical push. That is why BTT's sample
# config, and this file before the inversion was added, put every action in
# release_gcode. With '!' the names mean what they say: press_gcode is a push.
#
# Check with QUERY_BUTTON BUTTON=key6 before trusting either edge. Getting this
# backwards is silent -- the buttons still work, just on the wrong edge.
#
# These are one-shot and only armed while a button is down, so unlike the status
# loop above they add no steady-state timer load -- worth keeping in mind given
# this file's history with Timer too close.
[delayed_gcode _hbb_hold_nozzle]
gcode:
  M104 S0
  _HBB_HEATER_LEDS

[delayed_gcode _hbb_hold_bed]
gcode:
  M140 S0
  _HBB_HEATER_LEDS

[delayed_gcode _hbb_hold_drybox]
gcode:
  SET_HEATER_TEMPERATURE HEATER=drybox TARGET=0
  _HBB_HEATER_LEDS

# Step the nozzle or bed to the next preset above its current target, wrapping
# to off past the top:  off -> 220 -> 240 -> 260 -> 280 -> off
#
# Compares against the live target rather than tracking a position in the list,
# so it does the right thing when the temperature came from somewhere else: a
# slicer that set 230 steps to 240, not to the start of the list. Anything at or
# above the top step turns off.
[gcode_macro _HBB_CYCLE_TEMP]
gcode:
  {% set v = printer['gcode_macro _HBB_VARS'] %}
  {% set which = params.HEATER|default('nozzle')|lower %}
  {% if which == 'bed' %}
    {% set steps = v.bed_steps %}
    {% set cur = printer.heater_bed.target|float %}
  {% elif which == 'drybox' %}
    {% set steps = v.drybox_steps %}
    {% set cur = printer['heater_generic drybox'].target|float %}
  {% else %}
    {% set steps = v.nozzle_steps %}
    {% set cur = printer.extruder.target|float %}
  {% endif %}
  {% set ns = namespace(next=0.0, found=False) %}
  {% for s in steps %}
    {% if not ns.found and cur < (s|float - 0.5) %}
      {% set ns.next = s|float %}
      {% set ns.found = True %}
    {% endif %}
  {% endfor %}
  {% if which == 'bed' %}
    M140 S{ns.next}
  {% elif which == 'drybox' %}
    SET_HEATER_TEMPERATURE HEATER=drybox TARGET={ns.next}
  {% else %}
    M104 S{ns.next}
  {% endif %}
  _HBB_HEATER_LEDS

# LEDs 6 and 7 follow heater STATE, not the button press: red whenever that
# heater has a target at all, idle otherwise. Called from the status loop as
# well as on press, so a temperature set from Mainsail or by a print lights them
# too -- and so they clear when the print ends, which the old fixed red never
# did.
[gcode_macro _HBB_HEATER_LEDS]
gcode:
  {% set v = printer['gcode_macro _HBB_VARS'] %}
  {% if printer.extruder.target > 0 %}
    SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=6
  {% else %}
    SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=6
  {% endif %}
  {% if printer.heater_bed.target > 0 %}
    SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=7
  {% else %}
    SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=7
  {% endif %}
  {% if printer['heater_generic drybox'].target > 0 %}
    SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=3
  {% else %}
    SET_LED LED=HBB_LED RED={v.init_r} GREEN={v.init_g} BLUE={v.init_b} INDEX=3
  {% endif %}
  # Drybox strip follows the same state: breathing orange while heating, white
  # otherwise. Effects are defined in voron.cfg beside [neopixel drybox], split
  # into 8 interleaved groups so the strip does not pulse as one block -- hence
  # 8 calls on, but only 1 off, since drybox_idle covers every LED and REPLACE
  # disables anything sharing one.
  # Guarded rather than reasserted every pass, because SET_LED_EFFECT REPLACE
  # walks every effect against every led and this runs from the 5s loop.
  #
  # The guard compares against what is actually running, not a remembered flag.
  # A remembered flag desyncs: any bare STOP_LED_EFFECTS (every status_* macro
  # used to issue one) stops these effects without changing the heater target,
  # so intent still matched and the strip stayed dark until the drybox next
  # changed state. Reading the effects back makes that self-healing while still
  # doing nothing in the steady state. have = -1 means neither is running.
  {% set want = 1 if printer['heater_generic drybox'].target > 0 else 0 %}
  {% set have = 1 if printer['led_effect drybox_heating_1'].enabled
                else (0 if printer['led_effect drybox_idle'].enabled else -1) %}
  {% if want != have %}
    SET_GCODE_VARIABLE MACRO=_HBB_VARS VARIABLE=drybox_fx VALUE={want}
    {% if want %}
      {% for i in range(1, 9) %}
        SET_LED_EFFECT EFFECT=drybox_heating_{i} REPLACE=1 FADETIME=0.5
      {% endfor %}
    {% else %}
      SET_LED_EFFECT EFFECT=drybox_idle REPLACE=1 FADETIME=0.5
    {% endif %}
  {% endif %}

[neopixel HBB_LED]
pin: HBB:gpio20
chain_count: 7
color_order: GRB
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2


# Cached copy of the hbb_led initial colours.
#
# Reading printer.configfile.settings from a macro forces Klipper to build
# the entire parsed config for the template. Three delayed_gcode loops were
# each doing that three times every 5 seconds, blocking the klippy reactor
# for ~70ms a go. Klipper 0.13 also cut command lookahead from 2s to 1s
# (Config_Changes 2025-10-10), leaving less slack to absorb it -- the result
# was 'Timer too close' MCU shutdowns at print start, when Happy Hare and
# Blobifier macros added a further ~320ms stall on top.
#
# These values are static config, so read them once at startup.
[gcode_macro _HBB_VARS]
variable_init_r: 0.2
variable_init_g: 0.2
variable_init_b: 0.2
# Preset ladders for the two heater buttons. Nozzle covers PLA/PETG through
# ABS/ASA to PC; bed values are the Orca generic profiles for the same
# families (PLA 55, PETG 80, ABS/ASA 105, PC 110). Extruder max_temp is 310
# and bed max_temp 120, so both ladders stay inside their limits.
variable_nozzle_steps: [220, 240, 260, 280]
variable_bed_steps: [55, 80, 105, 110]
# Hold this long to jump straight to off instead of stepping the ladder.
# Drybox ladder, in BOX AIR temperature. Conservative on purpose: PLA is the
# constraint, its spools start softening around 50-55C, so the first step keeps
# PLA/PVA/TPU safe while still driving moisture off. 55 suits PETG/ABS/ASA, 65
# nylon and PC.
#
# These are air temperatures because [heater_generic drybox] now controls on the
# BME280 in the box, not the thermistor at the PTC core -- see
# docs/drybox-air-control.md in the home-network repo. Under the old element
# control the ladder was meaningless: a target of 45 was inert because the core
# satisfied it on ~3% power while box air never moved at all.
#
# The two sensors do NOT converge, contrary to what this note used to claim.
# Holding air at 40 puts the core near 110C. Read `bme280 drybox`
# for what the spools actually see (temperature and humidity) and
# `temperature_fan drybox_core` for the core.
#
# drybox_fan is still a heater_fan, so the core fan and both blowers only run
# while the heater is enabled; there is no independent fan control and no way
# to purge heat without the heater also being on.
#
# The element is a 350W PTC, which is self-limiting: its resistance climbs
# steeply past its Curie point -- measured at ~110C at 100% duty -- so it
# cannot run away regardless of the target.
variable_drybox_steps: [45, 55, 65]
variable_hold_secs: 0.75
# last drybox strip effect applied; -1 forces the first pass to set it
variable_drybox_fx: -1
gcode:

[delayed_gcode _hbb_cache_colours]
initial_duration: 1.
gcode:
  {% set n = printer.configfile.settings['neopixel hbb_led'] %}
  SET_GCODE_VARIABLE MACRO=_HBB_VARS VARIABLE=init_r VALUE={n.initial_red}
  SET_GCODE_VARIABLE MACRO=_HBB_VARS VARIABLE=init_g VALUE={n.initial_green}
  SET_GCODE_VARIABLE MACRO=_HBB_VARS VARIABLE=init_b VALUE={n.initial_blue}
