[mcu HBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621B056C7A-if00
restart_method: command

[temperature_sensor HBB]
sensor_type: temperature_mcu
sensor_mcu: HBB
min_temp: 10
max_temp: 100

[gcode_button key1]
pin: HBB:gpio25
press_gcode:
release_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0.4 BLUE=0 INDEX=1
  SET_GCODE_OFFSET Z_ADJUST=0.025
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  G4 P100
  SET_LED LED=HBB_LED RED={INIT_R} GREEN={INIT_G} BLUE={INIT_B} INDEX=1

[gcode_button key2]
pin: HBB:gpio26
press_gcode:
release_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0.4 BLUE=0 INDEX=2
  SET_GCODE_OFFSET Z_ADJUST=-0.025
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  G4 P100
  SET_LED LED=HBB_LED RED={INIT_R} GREEN={INIT_G} BLUE={INIT_B} INDEX=2
  
[gcode_button key3]
pin: HBB:gpio27
press_gcode:
release_gcode:
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  SET_LED LED=HBB_LED RED=1 GREEN=0.4 BLUE=0 INDEX=3
  G4 P100
  SET_LED LED=HBB_LED RED={INIT_R} GREEN={INIT_G} BLUE={INIT_B} INDEX=3

[gcode_button key4]
pin: HBB:gpio19
press_gcode:
release_gcode:
  _BUTTON_HOME

[gcode_macro _BUTTON_HOME]
gcode:
  UPDATE_DELAYED_GCODE ID=check_home_status DURATION=1
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G90    
    status_homing
    G28
    status_leveling
    QUAD_GANTRY_LEVEL
    status_homing
    G28
    PARK_PREHEAT
  {% else %}
    M84
  {% endif %}

[delayed_gcode check_home_status]
initial_duration: 5.
gcode:
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  {% if "xyz" in printer.toolhead.homed_axes %} 
    SET_LED LED=HBB_LED RED=0 GREEN=0.5 BLUE=0 INDEX=4
  {% else %}
    SET_LED LED=HBB_LED RED={INIT_R} GREEN={INIT_G} BLUE={INIT_B} INDEX=4
  {% endif %}
  UPDATE_DELAYED_GCODE ID=check_home_status DURATION=5

# EMERGENCY STOP. Fires on PRESS, not release, so it acts the instant it is hit.
# M112 shuts the MCUs down immediately -- nothing after it runs, which is why the
# LED is set first and never restored. Recovery is FIRMWARE_RESTART, not a second
# press. Chosen over key3 because key1/key2 either side of it are the Z baby-step
# keys used during a first layer.
[gcode_button key5]
pin: !HBB:gpio18
press_gcode:
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=5 SYNC=0
  M112
release_gcode:

[gcode_button key6]
pin: HBB:gpio13
press_gcode:
release_gcode:
  M104 S240
  SET_LED LED=HBB_LED RED=0.5 GREEN=0 BLUE=0 INDEX=6

[delayed_gcode check_nozzle_temp]
initial_duration: 5.
gcode:
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  UPDATE_DELAYED_GCODE ID=check_nozzle_temp DURATION=5

[gcode_button key7]
pin: HBB:gpio12
press_gcode:
release_gcode:
  M140 S105
  SET_LED LED=HBB_LED RED=0.5 GREEN=0 BLUE=0 INDEX=7

[delayed_gcode check_bed_temp]
initial_duration: 5.
gcode:
  {% set INIT_R = printer.configfile.settings['neopixel hbb_led'].initial_red|float %}
  {% set INIT_G = printer.configfile.settings['neopixel hbb_led'].initial_green|float %}
  {% set INIT_B = printer.configfile.settings['neopixel hbb_led'].initial_blue|float %}
  UPDATE_DELAYED_GCODE ID=check_bed_temp DURATION=5

[neopixel HBB_LED]
pin: HBB:gpio20
chain_count: 7
color_order: GRB
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2
