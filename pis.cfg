# FYSETC Portable Input Shaper (PIS) V1 -- RP2040 + ADXL345 over 4-wire SPI.
#
# INCLUDE THIS ONLY WHILE THE BOARD IS PLUGGED IN. Klipper refuses to start if
# an [mcu] it is configured for is absent, so comment the include out in
# octopus_pro_bear_N.cfg when the PIS goes back in the drawer.
#
# The board is portable across the fleet: the serial below is the RP2040 chip
# id, so it follows the board from machine to machine. Only the include moves.
#
# Firmware must match the host Klipper version exactly or you get MCU Protocol
# Error. Rebuild and reflash after every Klipper update:
#   cd ~/klipper && make clean
#   make KCONFIG_CONFIG=/home/pi/klipper-configs/firmware/rp2040-pis.config
#   make KCONFIG_CONFIG=.../rp2040-pis.config flash FLASH_DEVICE=2e8a:0003
# Built against v0.13.0-756-g2d7717e3b on 2026-09-18.
[mcu pis]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66160F423664235-if00

# Pins are from the FYSETC schematic (PIS.pdf): gpio10 SCK, gpio11 MOSI,
# gpio12 MISO, gpio13 CS. Software SPI on purpose.
#
# Do NOT add `spi_bus: spi1a` -- FYSETC ships that commented in their own
# PIS.cfg and it is WRONG for this board: spi1a is the deprecated alias for
# spi1_gpio8_gpio11_gpio10, i.e. MISO on gpio8, but the PIS has MISO on gpio12.
# That single line is the cause of several open issues on their repo.
#
# Every pin needs the `pis:` prefix or Klipper silently resolves it against the
# primary MCU and you get "adxl345: spi pins must be on same mcu".
[adxl345]
cs_pin: pis:gpio13
spi_software_sclk_pin: pis:gpio10
spi_software_mosi_pin: pis:gpio11
spi_software_miso_pin: pis:gpio12
# axes_map depends entirely on which bracket the board is in. Two measured so far:
#
#   BED MOUNT (Y runs)      axes_map: x,y,z
#     gravity on accel_z (~10190); 26k-sample capture over 3 Y sweeps at
#     100 mm/s put motion on accel_y (stdev y=2095, z=1506, x=720).
#
#   TOOLHEAD BRACKET (X runs)  axes_map: y,z,x   <-- ACTIVE
#     gravity on accel_x (~9500), so the board sits on its side here.
#     printer X <- accel_y per the physical mounting; printer Y <- accel_z is
#     the remaining axis. That permutation is cyclic, so it is a proper
#     right-handed rotation and Z keeps the correct positive sign.
#
# SWAP THIS LINE BACK WHEN THE BOARD RETURNS TO THE BED. The MK3 is a bed
# slinger: X is measured on the toolhead, Y on the bed, and the two mounts do
# NOT share an orientation.
axes_map: y,z,x

# MK3 is a BED SLINGER: measure X with the board on the toolhead, then
# physically move it to the bed and measure Y. A toolhead-mounted sensor
# measures the wrong mass for Y. Two passes, one sensor.
# Bed is 250 x 210, so this is centre.
[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 105, 20
