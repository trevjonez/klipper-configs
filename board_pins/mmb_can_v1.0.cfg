# BIGTREETECH MMB CAN V1.0 -- pin aliases
#
# Names match the SILKSCREEN, so a config line and the board in your hand say
# the same thing. Roles are deliberately NOT encoded here: the two MMBs on this
# machine are identical hardware doing different jobs, so role names belong in
# the consuming config, not the board map.
#
# Reference as `<mcu>:<ALIAS>`, e.g. `heater_pin: DRYBOX:MMB_SENSOR`.
#
# Applied to DRYBOX only. The MMU board already has [board_pins mmu] from Happy
# Hare (mmu/base/mmu.cfg) using MMU_* role names; aliasing the same pins twice
# under two schemes would only invite "pin used multiple times" confusion.
#
# Pin map source: klipper-configs/hardware/mmb-can-v1.0.md. It agrees across the
# vendor schematic text, the [board_pins mmu] aliases, and the live config --
# see that file before changing anything here.
#
# Every header is 5V / GND / 3.3V-logic-signal. There are NO power outputs on
# this board; the drybox heater and fan relay are both external.

[board_pins mmb_drybox]
mcu: DRYBOX
aliases:
    MMB_I2C_SDA=PB4,   MMB_I2C_SCL=PB3,

    MMB_MOT=PA0,
    MMB_SENSOR=PA1,
    MMB_RGB=PA2,

    MMB_STP1=PA3,      MMB_STP2=PA4,      MMB_STP3=PB9,
    MMB_STP4=PB8,      MMB_STP5=PC15,     MMB_STP6=PC13,
    MMB_STP7=PC14,     MMB_STP8=PB12,     MMB_STP9=PB11,
    MMB_STP10=PB10,    MMB_STP11=PB2,

    MMB_SPI_MISO=PA6,  MMB_SPI_SCK=PA5,   MMB_SPI_MOSI=PA7

aliases_steppers:
    MMB_M1_EN=PA8,     MMB_M1_STEP=PB15,  MMB_M1_DIR=PB14,   MMB_M1_CS=PA10,
    MMB_M2_EN=PD1,     MMB_M2_STEP=PD2,   MMB_M2_DIR=PB13,   MMB_M2_CS=PC7,
    MMB_M3_EN=PA15,    MMB_M3_STEP=PD0,   MMB_M3_DIR=PD3,    MMB_M3_CS=PC6,
    MMB_M4_EN=PB5,     MMB_M4_STEP=PB6,   MMB_M4_DIR=PB7,    MMB_M4_CS=PA9
