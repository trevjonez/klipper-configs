# BIGTREETECH Octopus Pro V1.0 (STM32F429ZGT6) -- pin aliases
#
# Names match the SILKSCREEN, so a config line and the board in your hand say
# the same thing. This is the primary [mcu], so aliases are referenced bare:
#
#     step_pin: DRIVER0_STEP
#     heater_pin: HE0
#
# Sources, and why they are trustworthy (see hardware/octopus-pro-v1.0.md):
#
#   * Pin VALUES come from klipper's own shipped
#     config/generic-bigtreetech-octopus-pro-v1.0.cfg. No pin number here was
#     read off an image.
#   * Connector LABELS come from the vendor V1.0 pinout, which is a rasterised
#     PDF. Using it for labels only is safe because the two sources agree on
#     every pin they share: all 32 DRIVER0-7 EN/STEP/DIR/CS values and all 8
#     STOP values match klipper's generic config exactly.
#   * Motor socket naming (MOTOR2 splits into MOTOR2_1 / MOTOR2_2, wired in
#     parallel off DRIVER2) is confirmed by BTT's own docs page.
#
# NOT included, because no text source names them and they were not needed:
# the RGB_LED header pin, and FAN6/FAN7 -- the vendor image shows eight fan
# labels but only six PWM pins (PA8, PE5, PD12-PD15) appear in klipper's
# generic config. Do not guess these; verify before adding.

[board_pins octopus_pro]
mcu: mcu

# Stepper driver sockets. DRIVER2 feeds both MOTOR2_1 and MOTOR2_2.
aliases:
    DRIVER0_EN=PF14,  DRIVER0_STEP=PF13,  DRIVER0_DIR=PF12,  DRIVER0_CS=PC4,
    DRIVER1_EN=PF15,  DRIVER1_STEP=PG0,   DRIVER1_DIR=PG1,   DRIVER1_CS=PD11,
    DRIVER2_EN=PG5,   DRIVER2_STEP=PF11,  DRIVER2_DIR=PG3,   DRIVER2_CS=PC6,
    DRIVER3_EN=PA0,   DRIVER3_STEP=PG4,   DRIVER3_DIR=PC1,   DRIVER3_CS=PC7,
    DRIVER4_EN=PG2,   DRIVER4_STEP=PF9,   DRIVER4_DIR=PF10,  DRIVER4_CS=PF2,
    DRIVER5_EN=PF1,   DRIVER5_STEP=PC13,  DRIVER5_DIR=PF0,   DRIVER5_CS=PE4,
    DRIVER6_EN=PD4,   DRIVER6_STEP=PE2,   DRIVER6_DIR=PE3,   DRIVER6_CS=PE1,
    DRIVER7_EN=PE0,   DRIVER7_STEP=PE6,   DRIVER7_DIR=PA14,  DRIVER7_CS=PD3

# Endstop headers. Also the per-driver DIAG lines for sensorless homing --
# STOP<n> is the same net as MOT<n>-DIAG<n>.
aliases_endstops:
    STOP0=PG6,   STOP1=PG9,   STOP2=PG10,  STOP3=PG11,
    STOP4=PG12,  STOP5=PG13,  STOP6=PG14,  STOP7=PG15

# Heater outputs and thermistor inputs.
aliases_heaters:
    BED_OUT=PA1,
    HE0=PA2,  HE1=PA3,  HE2=PB10,  HE3=PB11,
    TB=PF3,   T0=PF4,   T1=PF5,    T2=PF6,   T3=PF7

# Fan headers. FAN0 and FAN1 are asserted at boot via INITIAL_PINS.
aliases_fans:
    FAN0=PA8,   FAN1=PE5,   FAN2=PD12,
    FAN3=PD13,  FAN4=PD14,  FAN5=PD15

# Everything else. The BLTouch header is a servo PWM output plus a pulled-up
# input, which is why non-probe servo hardware tends to end up here.
aliases_misc:
    BLTOUCH_SERVO=PB7,  BLTOUCH_PROBE=PB6,
    SPI_MOSI=PA7,  SPI_MISO=PA6,  SPI_SCK=PA5,  SPI_CS=PF8
