#####################################################################
#   Probe
#####################################################################
[cartographer]
# Cartographer V4 on USB via the EBB's onboard hub, fitted 2026-09-25 in place
# of the BTT Eddy (whose RP2040, rated 85 C, kept tripping its 100 C limit on
# long ABS prints; the V4's STM32G431 is rated 125 C). Plan, rationale and the
# calibration campaign: home-network/docs/voron-cartographer-v4.md.
#
# Plugin is cartographer3d-plugin (the new one, not the legacy [scanner]). Its
# models autosave, so everything Cartographer stays HERE in the main config,
# never an [include] -- SAVE_CONFIG refuses to write an option that is also
# literally defined in an included file.
#
# It registers as `probe`, so `probe:z_virtual_endstop` on stepper_z is its
# SCAN endstop. Nozzle-contact Z-zero is CARTOGRAPHER_TOUCH_HOME, called from
# homing_override.
mcu: cartographer
x_offset: 0
y_offset: 21.1    # CNC Stealthburner mount, per vendor docs; the Eddy was 21.42. Not yet verified here.

[cartographer touch]
# Needs Cartographer firmware 6.2.0-tj2+ (patched; home-network
# docs/eddy-probe-design-review.md). Touch fires only after the approach has kept
# slowing for this distance. Z full-step ripple dips repeat every 0.08 mm (2 full
# steps), so each lasts < 0.04 mm plus the ~16.5 ms slope window; contact does not
# recover. Adds press depth, not an offset. Recalibrate touch after changing.
hold_distance: 0.05
# Touches start this far up and retract this far between samples, at 1 mm/s.
# Plugin minimum. Default 2.0 doubled every touch.
retract_distance: 1.0

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
# A SHUTDOWN threshold, same as the Eddy's was. 105 leaves 20 C under the
# part's 125 C rating. Do not raise it without measured data -- that is the
# whole lesson of the swap.
max_temp: 105

#[probe]
#pin: ^EBB:gpio6
#x_offset: 0.0
#y_offset: 0.0
#z_offset: 1.185
#speed: 5.0
#samples: 3
#samples_result: median
#sample_retract_dist: 3.0
#samples_tolerance: 0.006
#samples_tolerance_retries: 3
#activate_gcode:
#    {% set PROBE_TEMP = 150 %}
#    {% set MAX_TEMP = PROBE_TEMP + 5 %}
#    {% set ACTUAL_TEMP = printer.extruder.temperature %}
#    {% set TARGET_TEMP = printer.extruder.target %}
#
#    {% if TARGET_TEMP > PROBE_TEMP %}
#        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
#        M109 S{ PROBE_TEMP }
#    {% else %}
#        # Temperature target is already low enough, but nozzle may still be too hot.
#        {% if ACTUAL_TEMP > MAX_TEMP %}
#            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
#            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
#        {% endif %}
#    {% endif %}

#####################################################################
#   Fan Control
#####################################################################

# 70, not the usual 50-ish, because the extruder reading has a hard floor near
# 65C: D1's leakage sits in parallel with the thermistor and dominates once the
# element climbs past a few hundred kohm, so a genuinely cold hotend still reads
# ~65. Any threshold below that ran this fan 24/7. See hosts/voron.md, Hotend
# temperature scale.
#
# Only affects idle. heater_fan.py keys on "target_temp or current_temp >
# heater_temp", so a nonzero target keeps the fan on regardless -- this cannot
# strand a hot nozzle mid-print, it just ends the cooldown purge.
#
# 74, not 70. 70 was still inside the flat tail of the cooldown curve, where the
# reading approaches the ~65C floor asymptotically and lingers -- the fan dithered
# on and off for minutes. 74 sits clear of that tail. Displayed 74 is a true ~54C
# by the leakage model, still a sensible place to stop cooling an all-metal hotend.
[heater_fan hotend_fan]
pin: EBB:gpio14
heater: extruder
heater_temp: 74.0
#fan_speed: 0.85

[fan]
pin: EBB:gpio4
off_below: 0.1
kick_start_time: 0.5
cycle_time: 0.1

[heater_fan controller_fan]
pin: FAN0
heater: heater_bed
heater_temp: 45.0

# The exhaust fan is NOT here any more -- it is [temperature_fan Chamber], down
# with the chamber sensor it now closes the loop on.
[fan_generic nevermore]
pin: FAN2

# The post-print scrub-down. Armed by _NEVERMORE_FOLLOW_BED on the falling edge
# of the bed target; before that this section existed but nothing ever armed it
# and it has no initial_duration, so it had never once fired.
[delayed_gcode _filter_off]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

# Nevermore follows the bed target: any bed target at all means a print is
# running or being staged, so the filter should be running with it. Called from
# [delayed_gcode _hbb_status_leds] in hbb_voron.cfg -- that 5s poll already
# exists and already branches on heater_bed.target for the button LEDs, so this
# rides along instead of adding a second reactor timer.
#
# EDGE-TRIGGERED on both sides via `auto`, for two separate reasons:
#   - _HBB_VARS exists precisely because per-pass work in that loop stalled the
#     reactor ~70ms and produced 'Timer too close' shutdowns. A steady-state
#     pass here evaluates one comparison and issues nothing.
#   - asserting SPEED=0 on every idle pass would make TOGGLE_NEVERMORE useless:
#     a manual switch-on would be stomped within 5 seconds. Idle passes do
#     nothing, so a manual toggle stands.
#
# The falling edge arms _filter_off rather than cutting the fan, so the filter
# keeps scrubbing after an ABS print instead of stopping the instant the bed
# target clears. The rising edge cancels any pending off first, so starting a
# print inside the scrub window does not get switched off mid-print.
#
# Manual override during a print is one-way by design: if you TOGGLE_NEVERMORE
# off while the bed is hot, `auto` is already 1 and the loop will not fight you.
[gcode_macro _NEVERMORE_FOLLOW_BED]
variable_auto: 0            # 1 = the fan is on because this macro turned it on
variable_scrub_secs: 600    # keep filtering this long after the bed target clears
gcode:
    {% if printer.heater_bed.target > 0 %}
      {% if not auto %}
        UPDATE_DELAYED_GCODE ID=_filter_off DURATION=0
        SET_FAN_SPEED FAN=nevermore SPEED=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_FOLLOW_BED VARIABLE=auto VALUE=1
        {action_respond_info("Nevermore on (bed target set)")}
      {% endif %}
    {% elif auto %}
      UPDATE_DELAYED_GCODE ID=_filter_off DURATION={scrub_secs}
      SET_GCODE_VARIABLE MACRO=_NEVERMORE_FOLLOW_BED VARIABLE=auto VALUE=0
      {action_respond_info("Nevermore scrubbing for %dmin, then off" % (scrub_secs / 60))}
    {% endif %}

[gcode_macro TOGGLE_NEVERMORE]
gcode:
    {% if printer['fan_generic nevermore'].speed > 0 %}
      SET_FAN_SPEED FAN=nevermore SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=nevermore SPEED=1
    {% endif %}

# The chamber ceiling [temperature_fan Chamber] holds, chosen from the bed
# target as a proxy for the material. Below the split the chamber is waste heat
# and should go out the exhaust; above it the chamber IS the point and the
# ceiling is only a runaway cap. 90 puts PETG (80-85) on the venting side and
# ABS/ASA/nylon (100-110) on the hot side.
#
# Nothing calls this at the END of a print. END_PRINT reverts to the section's
# own target_temp instead, so a finished hot chamber coasts down on leakage
# rather than being actively bled off -- back-to-back ABS prints start from a
# warm box.
[gcode_macro _CHAMBER_CEILING]
variable_vent: 25        # under room temp, so the fan runs whenever the chamber warms
variable_bed_split: 90
# The IN-PRINT ceiling above the split. This used to read the config target_temp
# (60), which conflated two different things: the in-print cap and the value
# END_PRINT reverts to. They are now separate -- target_temp 60 stays the
# post-print idle, so back-to-back ABS still does not get bled down, while the
# print itself is held to 40.
#
# 40 set 2026-09-11 for thermal margin on the BTT Eddy, whose RP2040 shuts the
# MCU down at 100C and cascades to every other MCU. It hit 95.9C on a 34 minute
# ABS print and killed a 2.5h one outright. Venting above 40 costs chamber heat,
# which is a real trade for ABS, but the exhaust also pulls room air in at the
# front -- and that is what actually cools the board, since the hotend fan
# ingests at the front while the chamber probe sits at the back and never sees
# it. See hosts/voron.md, Eddy probe calibration.
variable_hot_ceiling: 40
variable_applied: -1     # last ceiling actually pushed; -1 = never
gcode:
    {% set bed = params.BED|default(printer.heater_bed.target)|float %}
    {% set idle = printer.configfile.settings['temperature_fan chamber'].target_temp|float %}
    # Three states, not two. No bed target at all means no print is staged, and
    # the chamber should be left to cool on its own -- falling through to vent
    # here would bleed it dry after every job, which is exactly what this was
    # built to avoid. Only a live bed target picks a material-driven ceiling.
    {% set t = idle if bed <= 0 else (vent if bed <= bed_split else hot_ceiling) %}
    # Edge-triggered: this runs from the 5s HBB poll, so a steady-state pass has
    # to issue nothing and say nothing, or it would spam 720 lines an hour.
    {% if t != applied %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber TARGET={t}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_CEILING VARIABLE=applied VALUE={t}
      {action_respond_info("Chamber exhaust ceiling %.0fC (bed target %.0fC)" % (t, bed))}
    {% endif %}

# Heater control is on box AIR, not the PTC element -- see
# docs/drybox-air-control.md in the home-network repo. Regulating the element
# meant a target of 45 was inert (element satisfied on 3% power, box air never
# moved) while 70 heated the box only as leakage.
[heater_generic drybox]
heater_pin: DRYBOX:MMB_SENSOR   # 3.3V drives the PTC's AC SSR directly
max_power: 1.0
min_temp: 0
# An air limit. The old 120 was an element limit; 80 is already hot enough to
# deform spools.
max_temp: 80
# BME280 in the box air, on HARDWARE I2C3 at 0x76. PB3/PB4 are the i2c3 pin pair
# on this stm32g0b1 (bus index 6 in src/stm32/stm32f0_i2c.c under
# CONFIG_MACH_STM32G0), so the earlier software bitbang was unnecessary.
#
# This is the ONLY section that configures this chip. It registers as
# `bme280 drybox` and reports temperature, humidity AND pressure, all of which
# moonraker renders on the heater's own row -- so a separate
# [temperature_sensor] duplicates the UI row and the I2C traffic for nothing.
# There used to be one; it was removed. Do not add it back.
#
# A BME280 needs no klipper patch to drive a heater: bme280.py hardcodes
# REPORT_TIME = 0.8 (bme280.py:9), inside MAX_HEAT_TIME of 3.0s (heaters.py:14).
# An AHT10 cannot -- its aht10_report_time floors at 5s, which is why the
# earlier attempt shut the DRYBOX MCU down. See docs/drybox-air-control.md.
sensor_type: BME280
i2c_mcu: DRYBOX
i2c_bus: i2c3_PB3_PB4
# Tuned on BOX AIR 2026-09-01 with PID_CALIBRATE HEATER=drybox TARGET=45 -- a
# real ladder rung, and PLA-safe: measured overshoot above target was 0.06C.
# 82 minutes, 5 clean cycles between 40.0 and 45.0, RH 29.7% -> 12.7%.
#
# Supersedes the 2026-08-31 air tune (Kp 74.872 / Ki 0.350 / Kd 4006.191), which
# was taken BEFORE the PTC core fan was split onto its own MOSFET. Ultimate gain
# barely moved (Ku 124.8 -> 126.3) but the oscillation period grew 428s -> 639s,
# so Kd is up ~50% and Ki down ~32%. The element-tuned values from before the
# move to air (Kp 27.382 / Ki 1.942 / Kd 96.520) are in git history.
#
# Deliberately kept HERE rather than in the SAVE_CONFIG autosave block, so the
# values are version-controlled and reviewable.
#
# SAVE_CONFIG is safe here -- klipper-patches/0001-save_config-follow-symlinks
# adds os.path.realpath(cfgname) so the renames replace THIS file rather than
# the printer.cfg symlink pointing at it. It is simply not how these values get
# updated: SAVE_CONFIG would write them into the autosave block and comment the
# four lines below out via _strip_duplicates. Instead read the new gains from
# `/printer/objects/query?configfile` -> save_config_pending_items, write them
# here, commit, then RESTART (which also drops the pending state).
control: pid
pid_Kp: 75.793
pid_Ki: 0.238
pid_Kd: 6044.180

[verify_heater drybox]
max_error: 1024
# Box air rises ~1C/70s at best and much slower near setpoint. The old 60s/1C
# gain check would trip "Heater drybox not heating at expected rate" and shut
# the printer down.
check_gain_time: 600
heating_gain: 1
hysteresis: 10

# Two fans, two mechanisms, split by whether they are SAFETY or convenience.
#
# The core fan on the PTC is safety-critical: the element must never be heated
# without air moving over it. It is therefore a heater_fan bound to the drybox
# heater, which klipper enforces internally -- no macro, no gcode path and no
# operator action can leave the heater on with this fan off. heater_fan also
# defaults to shutdown_speed 1.0, so it goes to FULL SPEED if klipper dies.
#
# Do not convert this to fan_generic or make it conditional. The interlock is
# the point.
#
# heater_temp is compared against the heater's own sensor, which is box air. So
# after the target clears, the core fan keeps running until the box falls under
# 40C.
#
# 40, not 30. Ambient is ~25C, so a 30C edge sits only 5C above it and the tail
# ran for a very long time -- the same too-close-to-ambient mistake the old
# all-three-fans heater_temp: 30 made. 40 clears ambient by 15C and releases
# promptly, and the element cools fast once air is moving over it (95C -> 88C in
# under ten seconds was measured), so a short purge is sufficient.
[heater_fan drybox_core]
pin: DRYBOX:MMB_STP10
heater: drybox
heater_temp: 40

# The circulating blowers move box air. They are the loud, high-flow pair, and
# the reason the fans were split at all -- previously they ran for hours after
# every cycle because they shared the core fan's purge threshold.
#
# Also a heater_fan, so klipper enforces this too. heater_temp is compared
# against the heater's own sensor (box air), and the heater's max_temp is 80, so
# 100 is UNREACHABLE: the `current_temp > heater_temp` clause can never fire and
# these track target on/off only, stopping the instant it clears.
#
# This deliberately replaced a fan_generic driven by a DRYBOX_SET macro. That
# worked, but any path bypassing the macro -- notably the Mainsail heater slider,
# which calls SET_HEATER_TEMPERATURE directly -- heated the box with no
# circulation. Proven on 2026-09-01: heater at 50 via the web UI, core fan on,
# blowers stopped. Binding both fans to the heater removes the bypass entirely.
[heater_fan drybox_blowers]
pin: DRYBOX:MMB_STP11
heater: drybox
heater_temp: 100

# The element thermistor is a readout and a garbage-value guard, not a control
# input -- nothing keys off it any more.
#
# The STP headers are endstop inputs: each has a 10K pull-up to 3.3V and a 100R
# series resistor (MMB CAN V1.0 schematic -- the pattern repeats for every STOP
# net). Klipper defaults to pullup_resistor 4700, so every element reading up to
# 2026-09-01 was computed against the wrong divider and read ~19C high: 44C
# indicated against 24.8C box air, in a box unpowered for hours and therefore
# necessarily at equilibrium. Corrected, it now tracks air to within ~2C.
#
# Anything recorded before that date was indicated, not true: the "116C at air
# 45" plateau is roughly 90C corrected. The error is nonlinear, so old numbers
# cannot be shifted by a constant.
[temperature_sensor Drybox_Element]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: DRYBOX:MMB_STP1
pullup_resistor: 10000
inline_resistor: 100
min_temp: 10
max_temp: 150

[neopixel drybox]
pin: DRYBOX:MMB_RGB
chain_count: 40
color_order: GRB
initial_red: 1.0
initial_green: 1.0
initial_blue: 1.0

# Drybox strip: plain white as a work light, breathing orange while the heater
# is on. Switched by _HBB_HEATER_LEDS in hbb_voron.cfg, which already tracks the
# heater state for the button LED and runs on press and from the 5s status loop.
#
# Same shape as the StealthBurner effects: one breathing layer at 24fps blended
# 'top'. led_effect precomputes the whole brightness curve at config load, so
# the per-frame cost is a table lookup.
#
# Deliberately NOT a 'heater' layer, which maps heater PROGRESS onto a gradient.
# That is useless here: the control thermistor sits on the PTC element and
# reaches target in ~30s, so the gradient would slam to its end while the box is
# still cold. Worth revisiting once control moves to the air sensor -- see
# docs/drybox-air-control.md in the home-network repo.
[led_effect drybox_idle]
autostart:              true
frame_rate:             24
leds:
    neopixel:drybox
layers:
    static  0 0 top (1.0, 1.0, 1.0)

# Night version of the above, selected by _HBB_HEATER_LEDS when _HBB_VARS.night
# is set. Same single static layer over the whole strip, at half.
#
# It has to be a second effect rather than a brightness argument: led_effect
# resolves its palette at config load and SET_LED_EFFECT takes no level. A bare
# SET_LED on this chain is not an option either -- an effect owns the strip and
# rewrites every LED at frame_rate, so a SET_LED is gone within ~40 ms.
#
# autostart is false and drybox_idle's is true, so a Klipper restart always
# comes up bright. That is deliberate: nothing in Klipper can read a wall clock,
# so `night` resets to 0 on restart and the strip would otherwise be lying about
# the time. voron-lights.timer on the host re-asserts the correct state within
# 15 minutes; see hosts/voron.md in the home-network repo.
[led_effect drybox_idle_dim]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox
layers:
    static  0 0 top (0.5, 0.5, 0.5)

# Breathes between 35 and 100 percent rather than fading to black, and the strip
# is split into 8 interleaved groups so it does not pulse as one block.
#
# Each group takes every 8th LED rather than a contiguous run, so neighbours
# are always in different groups and the variation reads as scattered along the
# length instead of banded. The periods share no small common multiple, so the
# groups drift apart and the pattern does not visibly repeat.
#
# Two layers per group: a static floor at 0.35 of the colour with the breathing
# layer 'add'ed on top at the remaining 0.65, so the peak still reaches full
# brightness. Both hold the same 1 : 0.4 : 0 ratio, so only brightness moves and
# the hue stays put.
#
# Layers are listed TOP FIRST -- _generateLayers does layers.insert(0, ...), so
# the config order is reversed and the last line is the bottom of the stack.
#
# Switched by _HBB_HEATER_LEDS in hbb_voron.cfg. Turning the strip white again
# needs only one call: drybox_idle covers every LED, and REPLACE=1 disables any
# effect sharing an LED with it.
#
# Deliberately NOT a 'heater' layer, which maps heater PROGRESS onto a gradient.
# That is useless here: the control thermistor sits on the PTC element and
# reaches target in ~30s, so the gradient would slam to its end while the box is
# still cold. Revisit once control moves to the air sensor -- see
# docs/drybox-air-control.md in the home-network repo.
[led_effect drybox_heating_1]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (1,9,17,25,33)
layers:
    breathing  2.6 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_2]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (2,10,18,26,34)
layers:
    breathing  3.1 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_3]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (3,11,19,27,35)
layers:
    breathing  3.7 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_4]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (4,12,20,28,36)
layers:
    breathing  2.9 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_5]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (5,13,21,29,37)
layers:
    breathing  4.1 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_6]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (6,14,22,30,38)
layers:
    breathing  3.3 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_7]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (7,15,23,31,39)
layers:
    breathing  2.7 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_8]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (8,16,24,32,40)
layers:
    breathing  3.9 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

# Chamber environment sensor on the Octopus's dedicated I2C header, which the
# silkscreen labels PB8=SCL / PB9=SDA -- matching klipper's i2c1a bus
# (BUS_PINS_i2c1a = "PB8,PB9", and struct i2c_info is {i2c, scl_pin, sda_pin}).
# Hardware I2C, no bitbang.
#
# NOTE that header supplies 3.3V, unlike the MMB's I2C header which is 5V. Do
# not carry that assumption between boards.
#
# PB6/PB7 (i2c1) would also have worked electrically but are taken: they are the
# BLTouch header, driving the Blobifier servo and bucket switch.
#
# Reports temperature, humidity and pressure. For drying, read DEW POINT rather
# than RH -- see docs/drybox-air-control.md in the home-network repo.
# Room ambient, on the MMU MMB's I2C header -- the only free I2C on that board.
# Mounted top rear, away from the MMU board itself and the exhaust vent.
#
# Same bus NAME as the drybox (i2c3_PB3_PB4) but a different MCU, so no clash.
# Note the MMB header supplies 5V where the Octopus's supplies 3.3V -- do not
# move a module between them assuming the same rail. PB4=SDA, PB3=SCL here,
# which is the opposite ordering to the Octopus header (PB8=SCL, PB9=SDA).
#
# This is the reference that makes the other two zones interpretable:
# chamber-minus-ambient is the real enclosure rise, and drybox dew point against
# ambient dew point is what tells you whether the box removes moisture or merely
# relocates it. See "The three zones" in docs/drybox-air-control.md.
# LIVE as of 2026-09-01 -- hardware mounted and verified. Klipper fails to start
# if it cannot find a BME280 at 0x76 on this bus, so if this board is ever
# unplugged, comment this section out again rather than leaving the repo
# undeployable.
#
# Verified by cross-checking pressure against the other two BME280s: Ambient
# 981.30, Chamber 981.18, drybox 980.16 hPa -- a 1.14 hPa spread across three
# independent sensors, inside the BME280's ~+/-1 hPa absolute accuracy. Three
# sensors agreeing on room barometric pressure is a good proof all three work.
# Ambient read 25.08C against Chamber's 28.51C, so it is sampling room air and
# not printer heat.
[temperature_sensor Ambient]
sensor_type: BME280
i2c_mcu: mmu
i2c_bus: i2c3_PB3_PB4

# This was a bare [temperature_sensor] plus a [heater_fan exhaust_fan] keyed to
# heater_bed >= 45C, which is backwards for every hot-chamber material: at a
# 105C bed it vented flat out, fighting exactly the heat an ABS print is trying
# to build. (Observed live 2026-09-07 mid-print: bed 105, chamber 41.9,
# exhaust 1.0.) One [temperature_fan] closes the loop on the chamber instead,
# and START_PRINT points the ceiling at the material via _CHAMBER_CEILING.
#
# Still named Chamber on purpose. bme280.py names itself from the LAST word of
# the section, so this still registers as `bme280 Chamber` and
# [temperature_sensor Chamber_DewPoint] below keeps resolving. Rename this and
# that section breaks at klippy:connect.
#
# min_temp/max_temp are MANDATORY on a temperature_fan where [temperature_sensor]
# left them unbounded, and an excursion now SHUTS KLIPPER DOWN mid-print. The
# range is deliberately far outside any control band: it is a dead-sensor check,
# not a limit.
#
# watermark is bang-bang at max_speed with a +/-max_delta band, so the fan is
# 100% or off -- which is what is wanted here. target_temp is both the restart
# default and what END_PRINT reverts to: 60C is above any chamber this machine
# reaches on its own, so idle means OFF, with a runaway cap for free.
[temperature_fan Chamber]
pin: FAN1
sensor_type: BME280
i2c_mcu: mcu
i2c_bus: i2c1a
min_temp: -20
max_temp: 90
control: watermark
max_delta: 2.0
target_temp: 60

# --- Derived psychrometrics -------------------------------------------------
#
# RH is not a water-content measure -- it is relative to what the air could hold
# at its current temperature, so heating a sealed box collapses RH while the
# water is all still there. These sections turn the three BME280s into the
# temperature-independent quantity (dew point) and, more usefully, into a single
# number for how well the drybox is doing.
#
# They are [temperature_sensor] sections on purpose. Moonraker only keeps
# history for temperature/target/power/speed (data_store.py:96), so humidity and
# pressure are live-only and never graph. Arriving as a `temperature` on a
# registered sensor is the only way a derived value becomes a line on the chart,
# and the units really are degrees C.
#
# Full detail -- vapour pressures, absolute humidity, the reference readings --
# is on the parallel objects `dew_point <name>` / `dew_point_depression <name>`,
# queryable via /printer/objects/query.

# How many degrees of dew point drier the box is than the room it leaks into.
# THIS is the efficacy line. Positive means the box is winning. It dips NEGATIVE
# early in a heat cycle, when water is coming out of the spools faster than the
# box can shed it -- that dip is the drying actually happening, not a fault.
# A box with no desiccant cannot beat ambient by leaking alone, so a reading
# that sits near 0 while hot means the box has hit the only floor available to
# it. See docs/drybox-air-control.md in the home-network repo.
[temperature_sensor Drybox_Advantage]
sensor_type: dew_point_depression
sensor: bme280 drybox
reference: bme280 Ambient

# The three zones in absolute terms. Plot these together and the whole story is
# one picture: the box falling away from the room, and the room as the floor it
# is working against.
[temperature_sensor Drybox_DewPoint]
sensor_type: dew_point
sensor: bme280 drybox

[temperature_sensor Ambient_DewPoint]
sensor_type: dew_point
sensor: bme280 Ambient

[temperature_sensor Chamber_DewPoint]
sensor_type: dew_point
sensor: bme280 Chamber


#####################################################################
#   LED Control
#####################################################################

#[output_pin caselight]
#pin: 
#pwm: true
#shutdown_value: 0
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[gcode_macro _HOME_X]
# The 0.9 -> 0.6 A homing current reduction was removed for TMC autotune.
# run_current is a startup input to everything autotune computes and nothing
# recomputes on SET_TMC_CURRENT, so homing at 0.6 A ran StallGuard against a
# chopper tuned for 0.9 A -- two mechanisms fighting over the same calibration.
# sgt: in voron_autotune.cfg is tuned at the full 0.9 A instead.
gcode:
    G28.1 X
    # Relative only for the back-off, then restore the caller's mode. Leaving G91 set made
    # a partial G28 (X/Y only) end relative, and START_PRINT runs before the slicer's G90.
    SAVE_GCODE_STATE NAME=_home_backoff
    G91
    G1 X-10 F10000
    RESTORE_GCODE_STATE NAME=_home_backoff

[gcode_macro _HOME_Y]
# The 0.9 -> 0.6 A homing current reduction was removed for TMC autotune.
# run_current is a startup input to everything autotune computes and nothing
# recomputes on SET_TMC_CURRENT, so homing at 0.6 A ran StallGuard against a
# chopper tuned for 0.9 A -- two mechanisms fighting over the same calibration.
# sgt: in voron_autotune.cfg is tuned at the full 0.9 A instead.
gcode:
    G28.1 Y
    # Relative only for the back-off, then restore the caller's mode. Leaving G91 set made
    # a partial G28 (X/Y only) end relative, and START_PRINT runs before the slicer's G90.
    SAVE_GCODE_STATE NAME=_home_backoff
    G91
    G1 Y-10 F10000
    RESTORE_GCODE_STATE NAME=_home_backoff

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Energise Z before ANY XY motion. The Z branch below is the only thing that
    # touched the Z steppers, so through _HOME_X and _HOME_Y they sat disabled and
    # the gantry hung on slack belts -- it sags as the mass moves, worst when Y
    # slams into the rear and puts the whole gantry weight in one corner.
    # SET_STEPPER_ENABLE only energises; it moves nothing and needs no homed
    # position, so it is safe before homing.
    SET_STEPPER_ENABLE STEPPER=stepper_z  ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=1

    {% if home_all or 'X' in params %}
      _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
      _HOME_Y
    {% endif %}
    {% if home_all or 'Z' in params %}
      BED_MESH_CLEAR
      G90
      G1 X175 Y175 F100000
      # Touch must run cold, and TEMPERATURE_WAIT cannot release while something is
      # holding the nozzle above the threshold -- it blocks the gcode queue forever,
      # and RESTART is itself a queued gcode, so nothing short of EStop or a service
      # restart clears it. Drop the target so the wait can finish.
      # Deliberately NOT restored afterwards: PRINT_START sets its own target later,
      # and when driving by hand a "too cold" error (or Happy Hare setting the target
      # itself) is wanted over homing silently reheating the nozzle behind you.
      M104 S0
      # Part fan at 100% for the wait. Free convection from print temp to 100C
      # is minutes; the part fan blows straight across the block and cuts it to
      # well under one. Guarded so a home on an already-cold nozzle does not
      # blip the fan -- the whole template renders before any of it executes, so
      # both tests see the same temperature and cannot disagree.
      {% set cooling = printer.extruder.temperature > 100 %}
      {% if cooling %}M106 S255{% endif %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=100
      {% if cooling %}M106 S0{% endif %}
      G28.1 Z
      # G28.1 Z homes on the SCAN endstop (coil distance) only. The real zero
      # comes from nozzle contact. Under the Eddy this was voron_knomi.cfg's
      # G28 wrapper doing PROBE METHOD=tap + SET_Z_FROM_PROBE, which applied
      # the contact point as a G-code offset. It lives here now, directly after
      # the cool-down that exists for it. The plugin refuses to touch above
      # 150 C, so the 100 C wait is conservative, not required.
      CARTOGRAPHER_TOUCH_HOME
      # Clear any G-code Z offset. SET_Z_FROM_PROBE used to OVERWRITE it on every
      # G28 Z, so a babystep (HBB buttons, console) never outlived the next home.
      # TOUCH_HOME sets Z directly and leaves the offset alone, so without this a
      # stale babystep would silently carry into the next print. To keep one,
      # Z_OFFSET_APPLY_PROBE + SAVE_CONFIG before re-homing.
      SET_GCODE_OFFSET Z=0
      G1 Z10
    {% endif %}

#[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position:175,175
#speed:100
#z_hop:10

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   15,10
   20,320   # was 15,320. At X15 the toolhead hits the Blobifier bucket-shake
            # arm, which fires the bucket switch and RESETS THE BLOB COUNT -- on
            # every QGL, i.e. every print via _HOME_AND_LEVEL. Found 2026-09-25;
            # X20 checked clear by eye. Probably predates the Cartographer swap,
            # since the X coordinate frame was deliberately kept the same.
   340,320
   340,10
speed: 350   # was 300; max_velocity is 350 so this is the ceiling
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01
max_adjust: 10

#--------------------------------------------------------------------
[bed_mesh]
# Cartographer's recommended shape: a dense continuous scan, no interpolation.
# 20x20 is the plugin docs' starting point. mesh_min/max are unchanged: y_offset
# went 21.42 -> 21.1, so probe Y25 still needs only nozzle Y3.9.
horizontal_move_z: 3
speed: 300
mesh_min: 15,25
mesh_max: 335,335
probe_count: 20,20
mesh_pps: 0,0
algorithm: bicubic
zero_reference_position: 175,175

#####################################################################
#   Macros
#####################################################################

# The home + gantry-level preamble. Shared by G32, START_PRINT and the HBB's
# _BUTTON_HOME, which each had their own byte-identical copy -- when the
# G28 -> G28 Z fix below was made it landed in one of the three and was silently
# missed in the other two. One definition now, so that cannot happen again.
#
# G28 Z, not G28: quad_gantry_level moves the Z steppers independently and so
# invalidates Z, but X and Y stay homed. A full G28 here re-ran sensorless
# homing on both for nothing, AND re-ran the homing_override Z branch's
# `TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=100`, which blocks until the nozzle
# is under 100C -- on a back-to-back print with a hot nozzle that wait was being
# paid twice.
[gcode_macro _HOME_AND_LEVEL]
description: Home all axes, quad gantry level, then re-home Z only
# SKIP_IF_READY=1 skips the whole cycle when the machine is provably still
# homed AND levelled. Both flags are cleared by klipper itself on the
# stepper_enable:motor_off event (quad_gantry_level.py:72) and by FORCE_MOVE,
# which invalidates kinematics -- so nothing extra has to be tracked. If the
# steppers lost power or were force-moved, this evaluates false and homes.
#
# Only START_PRINT passes it. G32 and the HBB button deliberately do not: a
# human asking to home expects the machine to home.
gcode:
    {% set skip = params.SKIP_IF_READY|default(0)|int
                  and 'xyz' in printer.toolhead.homed_axes
                  and printer.quad_gantry_level.applied %}
    {% if skip %}
      RESPOND MSG="Already homed and levelled -- skipping G28/QGL"
    {% else %}
      G90
      status_homing
      G28
      status_leveling
      QUAD_GANTRY_LEVEL
      status_homing
      G28 Z
    {% endif %}

[gcode_macro G32]
gcode = 
	_HOME_AND_LEVEL
	status_meshing
	BED_MESH_CALIBRATE METHOD=scan

[gcode_macro START_PRINT]
gcode = 
	{% set BED_TEMP = params.BED_TEMP|default(60)|float %}
	{% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
	{% set FIRST_Z = params.FIRST_Z|default(0.2)|float %}
	# Before the soak, so the chamber behaves during it too.
	# Ceiling is no longer set here. _CHAMBER_CEILING runs from the 5s HBB
	# poll and follows heater_bed.target, so it picks the material itself once
	# M190 sets the target. Calling it here too would set it from BED_TEMP
	# while the bed target is still 0, and the next poll would immediately
	# undo that -- two spurious transitions per print.
	# Touch must happen COLD: a hot nozzle risks marking the PEI and oozing
	# onto the bed at the contact point.
	# Absolute, explicitly: slicers call START_PRINT before their own G90, and every move
	# below is absolute. Whatever ran before (a relative jog, a macro that left G91) must
	# not turn the prime line into relative moves.
	G90
	M117 Home & Probe
	_HOME_AND_LEVEL SKIP_IF_READY=1
	# Heat the BED only, then mesh hot so the mesh captures thermal expansion
	# and gantry/bed flex. The nozzle is held at a no-ooze standby because
	# BED_MESH_CALIBRATE scans at mesh_height (3mm) -- low enough that ooze still lands on the bed.
	status_heating
	M117 Preheat
	M104 S150
	# Only soak if the bed actually has to climb. PARK_SOAK exists to hold the
	# eddy coil at Z100, away from a heating bed, for the duration of the wait --
	# with the bed already at target there is no wait, and the trip to Z100 and
	# back is pure cost. Keeping a hot bed between back-to-back ABS prints is the
	# normal case here, so this is the common path, not the exception.
	{% if printer.heater_bed.temperature < BED_TEMP - 2 %}
	  PARK_SOAK
	{% endif %}
	M190 S{BED_TEMP}
	status_meshing
	M117 Mesh (hot bed)
	BED_MESH_CALIBRATE METHOD=scan
	# Full nozzle temp last, parked over the purge bucket so ooze is caught.
	# M104 first so the ramp from 150 overlaps the park move instead of following it.
	status_heating
	M104 S{EXTRUDER_TEMP}
	PARK_PREHEAT
	M109 S{EXTRUDER_TEMP}
	#status_cleaning
	#PRIME_LINE FIRST_Z={FIRST_Z}
	#status_printing

[gcode_macro PRIME_LINE]
gcode = 
	{% set FIRST_Z = params.FIRST_Z|default(0.2)|float %}
	M117 Purging Nozzle
	G1 X2.0 Y2.0 F5000.0
	M106 S255
	G1 X7.0 Y2.0 Z{FIRST_Z} F5000.0
	M107
	G92 E0.0
	G1 E10 F600.0
	G92 E0.0
	G1 X62.0 Y2.0 E5 F600.0
	G92 E0.0
	G1 X262.0 Y2.0 E50 F600.0
	G1 X262.0 Y2.0 Z4.0 F10000.0
	G1 X250.0 Y2.0 Z2.0 F10000.0
	G92 E0.0
	M117

[gcode_macro END_PRINT]
gcode = 
	status_cooling
	# Back to the section's own target_temp (60C) = exhaust off, chamber coasts
	# down on leakage. A bare SET_TEMPERATURE_FAN_TARGET with no TARGET reverts
	# to target_temp_conf -- see klippy/extras/temperature_fan.py. Deliberately
	# NOT a post-print purge: back-to-back ABS should not restart from cold.
	SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber
	M140 S0
	M104 S0
	M107
	G92 E0.0
	G1 E-1.0 F50000.0
	G92 E0.0
	PARK
	status_ready

[gcode_macro PARK]
gcode:
  MOVE_UP
  PARK_XY

[gcode_macro MOVE_UP]
gcode:
  # The GET_POSITION calls that used to bracket this (one here, one via
  # [delayed_gcode DELAY_GET_POSITION] four seconds later) were debugging and
  # only produced console noise. F5000 is above max_z_velocity 30 mm/s and is
  # clamped to it; left as-is so the intent reads "as fast as Z goes".
  #
  # Z target is current+20, but floored at half the Z axis. The floor is there
  # for NOZZLE ACCESS, not part clearance: current+20 alone leaves the toolhead
  # low after a short job, which is exactly when you want to get at the nozzle to
  # wipe it. Half the axis puts it at a comfortable working height regardless of
  # how tall the print was. Still clamped to position_max so it can never command
  # past the axis.
  #
  #   min( max(current + 20, position_max / 2), position_max )
  #
  {% set zmax = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set z = [ [printer.gcode_move.gcode_position.z + 20, zmax / 2]|max, zmax ]|min %}
  G1 Z{z} F5000.0

[delayed_gcode DELAY_GET_POSITION]
gcode:
  GET_POSITION

[gcode_macro PARK_SOAK]
gcode = 
	# Same XY as PARK_PREHEAT, but high, to keep the probe coil away from the
	# heating bed. Coil temperature shifts the frequency response that scan-based
	# meshing depends on, so soaking at Z10 biases the mesh. (The Cartographer
	# compensates for coil temperature, but only across the range
	# CARTOGRAPHER_TEMPERATURE_CALIBRATE covered -- MIN_TEMP is 40C at the lowest
	# -- so a coil warming from ambient during a soak can start below it. The
	# Eddy had the same gap at 47.4C.)
	#
	# XY derived the same way PARK_PREHEAT derives it, so the two genuinely match
	# and the soak -> preheat transition is a pure Z move with no XY travel.
	#
	# Z100 dominates this move: with ~90mm of Z against ~300mm of XY, the vector
	# is capped near 104 mm/s by max_z_velocity regardless. F4000 (67 mm/s) was
	# below even that, so raising it is a real saving and clamps safely.
		# v4 moved Blobifier's variables off [gcode_macro BLOBIFIER], which now
	# carries only 'initialized', into [gcode_macro _BLOBIFIER_VARS]. These
	# reads kept working only while the dead v3 mmu/addons/blobifier.cfg was
	# still included -- its BLOBIFIER macro did define them. Removing that
	# duplicate include (the fix for the slow Z) took them away, and this was
	# the first PRINT_START after.
	{% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
	{% set x = [bl.brush_start - 20, 30]|max %}
	{% set y = printer.toolhead.axis_maximum.y - bl.skew_correction - bl.y_offset %}
	G1 X{x} Y{y} Z100 F18000.0

# Parks exactly where BLOBIFIER's first move goes, so that move becomes a no-op.
# Derived from Blobifier's own variables rather than hardcoded, so the two cannot
# drift apart if brush_start / y_offset / skew_correction are ever retuned:
#   blobifier.cfg:295  position_y = pos_max.y - skew_correction - y_offset
#   blobifier.cfg:356  G1 X{[brush_start - 20, 30]|max} Y{position_y}
# Currently resolves to X70, Y355.9 -- the safe approach point Blobifier uses
# before descending to the tray and sliding to purge_x.
#
# This is OVER THE BUCKET, and structurally so rather than by luck. The bucket
# spans the whole way from the blob position (purge_x, X3) to the brush
# (brush_start, X90) -- owner-confirmed 2026-09-10 -- and max(brush_start-20, 30)
# can only ever land inside that span. So the parked nozzle stays over the bucket
# for any sane brush_start, not just the current one.
#
# That matters and is not derivable from this config: M109 ramps the nozzle
# 150 -> target with toolhead_residual_filament still in the melt zone, so
# whatever oozes during that wait has to land somewhere catchable. The hardcoded
# X20 this replaced was chosen for the same reason.
#
# Z10 is kept: Blobifier descends from wherever it finds the toolhead
# (blobifier.cfg:374), and 10 clears clearance_z 2 and the
# force_safe_descend_height_until floor.
[gcode_macro PARK_PREHEAT]
gcode:
  	# v4 moved Blobifier's variables off [gcode_macro BLOBIFIER], which now
	# carries only 'initialized', into [gcode_macro _BLOBIFIER_VARS]. These
	# reads kept working only while the dead v3 mmu/addons/blobifier.cfg was
	# still included -- its BLOBIFIER macro did define them. Removing that
	# duplicate include (the fix for the slow Z) took them away, and this was
	# the first PRINT_START after.
	{% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}
  {% set x = [bl.brush_start - 20, 30]|max %}
  {% set y = printer.toolhead.axis_maximum.y - bl.skew_correction - bl.y_offset %}
  # Klipper clamps the vector so no axis exceeds its own max, so a high F is
  # safe here even with a Z component -- max_z_velocity 30 still governs Z.
  G1 X{x} Y{y} Z10 F18000.0

[gcode_macro PARK_XY]
gcode:
  # F4000 was 67 mm/s against a 350 mm/s machine. Pure XY, so nothing clamps it.
  G1 X175 Y325.0 F18000.0

