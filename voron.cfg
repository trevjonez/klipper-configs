#####################################################################
#   Probe
#####################################################################
[temperature_sensor btt_edy_mcu]
sensor_type: temperature_mcu
sensor_mcu: EDDY
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
# Compensates the cold-tap / hot-print difference. Tap runs cold (a hot
# nozzle marks PEI and oozes), but the nozzle expands ~0.1mm at temperature,
# so the first layer came out over-squished by about that much. Applied as
#   adj_z_contact = z_contact - tap_z_offset   (probe_eddy_current.py:882)
# so a NEGATIVE value lifts the nozzle. Derived from live baby-stepping:
# +0.05 then +0.01 during a print, and it wanted slightly more still.
# To re-derive later: baby-step during a print until the first layer is
# right, then Z_OFFSET_APPLY_PROBE METHOD=tap followed by SAVE_CONFIG.
# The METHOD=tap is mandatory -- without it the command rewrites the whole
# calibrate table instead.
tap_z_offset: -0.1
sensor_type: ldc1612
# descend_z is the nominal nozzle-to-bed distance a probing attempt stops at.
# Klipper docs recommend 0.5mm. Previously unset, so the module silently fell
# back to the deprecated z_offset key (3.321, written by PROBE_CALIBRATE as a
# TRIGGER offset) and probed 3.3mm off the bed where the sensor is weakest.
descend_z: 0.5
i2c_mcu: EDDY
i2c_bus: i2c0f
x_offset: 0
y_offset: 21.42
#reg_drive_current: 15
samples: 2
sample_retract_dist: 2
# samples_tolerance_retries defaults to 0 (probe.py:294): the FIRST time two
# samples at a point disagree beyond samples_tolerance, the whole probe run
# aborts. On 2026-09-10 that killed a QUAD_GANTRY_LEVEL over a single pair
# spreading 0.119 against the 0.100 tolerance. samples_tolerance itself is left
# at the default -- the samples still have to agree, they just get more chances.
#
# KNOW THE LIMIT OF THIS: retries help TRANSIENT noise. They do NOT catch a probe
# reading something that is not the bed. In that same 2026-09-10 event the
# nozzle was off the bed entirely (XY had shifted mid-QGL) and three of the four
# sample pairs agreed with each other perfectly while being garbage -- only one
# pair happened to trip the tolerance. With retries enabled that run would more
# likely have PASSED and levelled the gantry to readings taken off the bed.
# A QGL that errors is not always worse than one that succeeds.
samples_tolerance_retries: 3

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: EDDY:gpio26
horizontal_move_z: 2
# Automates TEMPERATURE_PROBE_CALIBRATE. Without these the procedure demands a
# manual paper-test probe every 2C from cold to target, with the bed and
# extruder driven by hand -- which is why drift_calibration was left empty.
calibration_position: 175, 175, 1
calibration_extruder_temp: 150
extruder_heating_z: 50
calibration_bed_temp: 110
max_validation_temp: 110

