#####################################################################
#   Extruder
#####################################################################

##  In E0-MOT Position
[extruder]
step_pin: EBB:gpio18
dir_pin: EBB:gpio19
enable_pin: !EBB:gpio17

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBB:gpio7
sensor_type: T-D500
sensor_pin: EBB:gpio26
# The EBB SB2209 USB thermistor divider is 2.2K, not Klipper's 4700 default:
# R10 2.2K 0.1% on the board schematic, and BTT's own docs warn in red not to
# write it as 4.7K. Unset until 2026-09-13, so every hotend reading was computed
# against the wrong divider and read LOW -- a displayed 250 was nearer 290.
# Same class of bug as Drybox_Element (see its note); this one just went unnoticed
# longer. R12/R13 (2.37K each) sit between the divider and the ADC pin, not in the
# thermistor leg, so there is no inline_resistor to declare here.
pullup_resistor: 2200
min_temp: -50
max_temp: 310
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_Kp = 21.190
#pid_Ki = 1.296 
#pid_Kd = 86.616
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 2.4
max_extrude_only_distance: 5000

[tmc2209 extruder]
uart_pin: EBB:gpio20
interpolate: true   # was false; autotune wants interpolation
run_current: 0.65
sense_resistor: 0.110
# stealthchop_threshold: 999999

