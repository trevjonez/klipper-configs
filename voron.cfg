# Cartographer V4's onboard ADXL345, added 2026-09-25 to compare against the
# LIS2DW above: it sits much closer to the nozzle. [resonance_tester] still
# uses lis2dw, so this changes nothing until a deliberate switch.
# cs_pin is PA0 for V4 and PA3 for V3. Cartographer's docs warn the wrong one
# causes an endless boot loop; PA0 was confirmed from the raw source of their
# klipper-setup doc, not a search summary (which had it backwards).
# axes_map measured 2026-09-25 by recording both chips through the same
# X and Y shakes and correlating against the lis2dw's already-mapped axes:
#   printer X = raw +y (corr +0.979), printer Y = raw -x (corr -0.986),
#   printer Z = raw +z (gravity reads +9729). Magnitudes agree to ~2-4%.
[adxl345 cartographer]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: y, -x, z

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: lis2dw

