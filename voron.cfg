#####################################################################
#   Fan Control
#####################################################################

[heater_fan hotend_fan]
pin: EBB:gpio14
heater: extruder
heater_temp: 55.0
#fan_speed: 0.85

[fan]
pin: EBB:gpio4
off_below: 0.1
kick_start_time: 0.5
cycle_time: 0.1

[heater_fan controller_fan]
pin: FAN0
heater: heater_bed
heater_temp: 45.0

# The exhaust fan is NOT here any more -- it is [temperature_fan Chamber], down
# with the chamber sensor it now closes the loop on.
[fan_generic nevermore]
pin: FAN2

# The post-print scrub-down. Armed by _NEVERMORE_FOLLOW_BED on the falling edge
# of the bed target; before that this section existed but nothing ever armed it
# and it has no initial_duration, so it had never once fired.
[delayed_gcode _filter_off]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

# Nevermore follows the bed target: any bed target at all means a print is
# running or being staged, so the filter should be running with it. Called from
# [delayed_gcode _hbb_status_leds] in hbb_voron.cfg -- that 5s poll already
# exists and already branches on heater_bed.target for the button LEDs, so this
# rides along instead of adding a second reactor timer.
#
# EDGE-TRIGGERED on both sides via `auto`, for two separate reasons:
#   - _HBB_VARS exists precisely because per-pass work in that loop stalled the
#     reactor ~70ms and produced 'Timer too close' shutdowns. A steady-state
#     pass here evaluates one comparison and issues nothing.
#   - asserting SPEED=0 on every idle pass would make TOGGLE_NEVERMORE useless:
#     a manual switch-on would be stomped within 5 seconds. Idle passes do
#     nothing, so a manual toggle stands.
#
# The falling edge arms _filter_off rather than cutting the fan, so the filter
# keeps scrubbing after an ABS print instead of stopping the instant the bed
# target clears. The rising edge cancels any pending off first, so starting a
# print inside the scrub window does not get switched off mid-print.
#
# Manual override during a print is one-way by design: if you TOGGLE_NEVERMORE
# off while the bed is hot, `auto` is already 1 and the loop will not fight you.
[gcode_macro _NEVERMORE_FOLLOW_BED]
variable_auto: 0            # 1 = the fan is on because this macro turned it on
variable_scrub_secs: 600    # keep filtering this long after the bed target clears
gcode:
    {% if printer.heater_bed.target > 0 %}
      {% if not auto %}
        UPDATE_DELAYED_GCODE ID=_filter_off DURATION=0
        SET_FAN_SPEED FAN=nevermore SPEED=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_FOLLOW_BED VARIABLE=auto VALUE=1
        {action_respond_info("Nevermore on (bed target set)")}
      {% endif %}
    {% elif auto %}
      UPDATE_DELAYED_GCODE ID=_filter_off DURATION={scrub_secs}
      SET_GCODE_VARIABLE MACRO=_NEVERMORE_FOLLOW_BED VARIABLE=auto VALUE=0
      {action_respond_info("Nevermore scrubbing for %dmin, then off" % (scrub_secs / 60))}
    {% endif %}

[gcode_macro TOGGLE_NEVERMORE]
gcode:
    {% if printer['fan_generic nevermore'].speed > 0 %}
      SET_FAN_SPEED FAN=nevermore SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=nevermore SPEED=1
    {% endif %}

# The chamber ceiling [temperature_fan Chamber] holds, chosen from the bed
# target as a proxy for the material. Below the split the chamber is waste heat
# and should go out the exhaust; above it the chamber IS the point and the
# ceiling is only a runaway cap. 90 puts PETG (80-85) on the venting side and
# ABS/ASA/nylon (100-110) on the hot side.
#
# Nothing calls this at the END of a print. END_PRINT reverts to the section's
# own target_temp instead, so a finished hot chamber coasts down on leakage
# rather than being actively bled off -- back-to-back ABS prints start from a
# warm box.
[gcode_macro _CHAMBER_CEILING]
variable_vent: 25        # under room temp, so the fan runs whenever the chamber warms
variable_bed_split: 90
# The IN-PRINT ceiling above the split. This used to read the config target_temp
# (60), which conflated two different things: the in-print cap and the value
# END_PRINT reverts to. They are now separate -- target_temp 60 stays the
# post-print idle, so back-to-back ABS still does not get bled down, while the
# print itself is held to 40.
#
# 40 set 2026-09-11 for thermal margin on the BTT Eddy, whose RP2040 shuts the
# MCU down at 100C and cascades to every other MCU. It hit 95.9C on a 34 minute
# ABS print and killed a 2.5h one outright. Venting above 40 costs chamber heat,
# which is a real trade for ABS, but the exhaust also pulls room air in at the
# front -- and that is what actually cools the board, since the hotend fan
# ingests at the front while the chamber probe sits at the back and never sees
# it. See hosts/voron.md, Eddy probe calibration.
variable_hot_ceiling: 40
variable_applied: -1     # last ceiling actually pushed; -1 = never
gcode:
    {% set bed = params.BED|default(printer.heater_bed.target)|float %}
    {% set idle = printer.configfile.settings['temperature_fan chamber'].target_temp|float %}
    # Three states, not two. No bed target at all means no print is staged, and
    # the chamber should be left to cool on its own -- falling through to vent
    # here would bleed it dry after every job, which is exactly what this was
    # built to avoid. Only a live bed target picks a material-driven ceiling.
    {% set t = idle if bed <= 0 else (vent if bed <= bed_split else hot_ceiling) %}
    # Edge-triggered: this runs from the 5s HBB poll, so a steady-state pass has
    # to issue nothing and say nothing, or it would spam 720 lines an hour.
    {% if t != applied %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber TARGET={t}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_CEILING VARIABLE=applied VALUE={t}
      {action_respond_info("Chamber exhaust ceiling %.0fC (bed target %.0fC)" % (t, bed))}
    {% endif %}

# Heater control is on box AIR, not the PTC element -- see
# docs/drybox-air-control.md in the home-network repo. Regulating the element
# meant a target of 45 was inert (element satisfied on 3% power, box air never
# moved) while 70 heated the box only as leakage.
[heater_generic drybox]
heater_pin: DRYBOX:MMB_SENSOR   # 3.3V drives the PTC's AC SSR directly
max_power: 1.0
min_temp: 0
# An air limit. The old 120 was an element limit; 80 is already hot enough to
# deform spools.
max_temp: 80
# BME280 in the box air, on HARDWARE I2C3 at 0x76. PB3/PB4 are the i2c3 pin pair
# on this stm32g0b1 (bus index 6 in src/stm32/stm32f0_i2c.c under
# CONFIG_MACH_STM32G0), so the earlier software bitbang was unnecessary.
#
# This is the ONLY section that configures this chip. It registers as
# `bme280 drybox` and reports temperature, humidity AND pressure, all of which
# moonraker renders on the heater's own row -- so a separate
# [temperature_sensor] duplicates the UI row and the I2C traffic for nothing.
# There used to be one; it was removed. Do not add it back.
#
# A BME280 needs no klipper patch to drive a heater: bme280.py hardcodes
# REPORT_TIME = 0.8 (bme280.py:9), inside MAX_HEAT_TIME of 3.0s (heaters.py:14).
# An AHT10 cannot -- its aht10_report_time floors at 5s, which is why the
# earlier attempt shut the DRYBOX MCU down. See docs/drybox-air-control.md.
sensor_type: BME280
i2c_mcu: DRYBOX
i2c_bus: i2c3_PB3_PB4
# Tuned on BOX AIR 2026-09-01 with PID_CALIBRATE HEATER=drybox TARGET=45 -- a
# real ladder rung, and PLA-safe: measured overshoot above target was 0.06C.
# 82 minutes, 5 clean cycles between 40.0 and 45.0, RH 29.7% -> 12.7%.
#
# Supersedes the 2026-08-31 air tune (Kp 74.872 / Ki 0.350 / Kd 4006.191), which
# was taken BEFORE the PTC core fan was split onto its own MOSFET. Ultimate gain
# barely moved (Ku 124.8 -> 126.3) but the oscillation period grew 428s -> 639s,
# so Kd is up ~50% and Ki down ~32%. The element-tuned values from before the
# move to air (Kp 27.382 / Ki 1.942 / Kd 96.520) are in git history.
#
# Deliberately kept HERE rather than in the SAVE_CONFIG autosave block, so the
# values are version-controlled and reviewable.
#
# SAVE_CONFIG is safe here -- klipper-patches/0001-save_config-follow-symlinks
# adds os.path.realpath(cfgname) so the renames replace THIS file rather than
# the printer.cfg symlink pointing at it. It is simply not how these values get
# updated: SAVE_CONFIG would write them into the autosave block and comment the
# four lines below out via _strip_duplicates. Instead read the new gains from
# `/printer/objects/query?configfile` -> save_config_pending_items, write them
# here, commit, then RESTART (which also drops the pending state).
control: pid
pid_Kp: 75.793
pid_Ki: 0.238
pid_Kd: 6044.180

[verify_heater drybox]
max_error: 1024
# Box air rises ~1C/70s at best and much slower near setpoint. The old 60s/1C
# gain check would trip "Heater drybox not heating at expected rate" and shut
# the printer down.
check_gain_time: 600
heating_gain: 1
hysteresis: 10

# Two fans, two mechanisms, split by whether they are SAFETY or convenience.
#
# The core fan on the PTC is safety-critical: the element must never be heated
# without air moving over it. It is therefore a heater_fan bound to the drybox
# heater, which klipper enforces internally -- no macro, no gcode path and no
# operator action can leave the heater on with this fan off. heater_fan also
# defaults to shutdown_speed 1.0, so it goes to FULL SPEED if klipper dies.
#
# Do not convert this to fan_generic or make it conditional. The interlock is
# the point.
#
# heater_temp is compared against the heater's own sensor, which is box air. So
# after the target clears, the core fan keeps running until the box falls under
# 40C.
#
# 40, not 30. Ambient is ~25C, so a 30C edge sits only 5C above it and the tail
# ran for a very long time -- the same too-close-to-ambient mistake the old
# all-three-fans heater_temp: 30 made. 40 clears ambient by 15C and releases
# promptly, and the element cools fast once air is moving over it (95C -> 88C in
# under ten seconds was measured), so a short purge is sufficient.
[heater_fan drybox_core]
pin: DRYBOX:MMB_STP10
heater: drybox
heater_temp: 40

# The circulating blowers move box air. They are the loud, high-flow pair, and
# the reason the fans were split at all -- previously they ran for hours after
# every cycle because they shared the core fan's purge threshold.
#
# Also a heater_fan, so klipper enforces this too. heater_temp is compared
# against the heater's own sensor (box air), and the heater's max_temp is 80, so
# 100 is UNREACHABLE: the `current_temp > heater_temp` clause can never fire and
# these track target on/off only, stopping the instant it clears.
#
# This deliberately replaced a fan_generic driven by a DRYBOX_SET macro. That
# worked, but any path bypassing the macro -- notably the Mainsail heater slider,
# which calls SET_HEATER_TEMPERATURE directly -- heated the box with no
# circulation. Proven on 2026-09-01: heater at 50 via the web UI, core fan on,
# blowers stopped. Binding both fans to the heater removes the bypass entirely.
[heater_fan drybox_blowers]
pin: DRYBOX:MMB_STP11
heater: drybox
heater_temp: 100

# The element thermistor is a readout and a garbage-value guard, not a control
# input -- nothing keys off it any more.
#
# The STP headers are endstop inputs: each has a 10K pull-up to 3.3V and a 100R
# series resistor (MMB CAN V1.0 schematic -- the pattern repeats for every STOP
# net). Klipper defaults to pullup_resistor 4700, so every element reading up to
# 2026-09-01 was computed against the wrong divider and read ~19C high: 44C
# indicated against 24.8C box air, in a box unpowered for hours and therefore
# necessarily at equilibrium. Corrected, it now tracks air to within ~2C.
#
# Anything recorded before that date was indicated, not true: the "116C at air
# 45" plateau is roughly 90C corrected. The error is nonlinear, so old numbers
# cannot be shifted by a constant.
[temperature_sensor Drybox_Element]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: DRYBOX:MMB_STP1
pullup_resistor: 10000
inline_resistor: 100
min_temp: 10
max_temp: 150

[neopixel drybox]
pin: DRYBOX:MMB_RGB
chain_count: 40
color_order: GRB
initial_red: 1.0
initial_green: 1.0
initial_blue: 1.0

# Drybox strip: plain white as a work light, breathing orange while the heater
# is on. Switched by _HBB_HEATER_LEDS in hbb_voron.cfg, which already tracks the
# heater state for the button LED and runs on press and from the 5s status loop.
#
# Same shape as the StealthBurner effects: one breathing layer at 24fps blended
# 'top'. led_effect precomputes the whole brightness curve at config load, so
# the per-frame cost is a table lookup.
#
# Deliberately NOT a 'heater' layer, which maps heater PROGRESS onto a gradient.
# That is useless here: the control thermistor sits on the PTC element and
# reaches target in ~30s, so the gradient would slam to its end while the box is
# still cold. Worth revisiting once control moves to the air sensor -- see
# docs/drybox-air-control.md in the home-network repo.
[led_effect drybox_idle]
autostart:              true
frame_rate:             24
leds:
    neopixel:drybox
layers:
    static  0 0 top (1.0, 1.0, 1.0)

# Night version of the above, selected by _HBB_HEATER_LEDS when _HBB_VARS.night
# is set. Same single static layer over the whole strip, at half.
#
# It has to be a second effect rather than a brightness argument: led_effect
# resolves its palette at config load and SET_LED_EFFECT takes no level. A bare
# SET_LED on this chain is not an option either -- an effect owns the strip and
# rewrites every LED at frame_rate, so a SET_LED is gone within ~40 ms.
#
# autostart is false and drybox_idle's is true, so a Klipper restart always
# comes up bright. That is deliberate: nothing in Klipper can read a wall clock,
# so `night` resets to 0 on restart and the strip would otherwise be lying about
# the time. voron-lights.timer on the host re-asserts the correct state within
# 15 minutes; see hosts/voron.md in the home-network repo.
[led_effect drybox_idle_dim]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox
layers:
    static  0 0 top (0.5, 0.5, 0.5)

# Breathes between 35 and 100 percent rather than fading to black, and the strip
# is split into 8 interleaved groups so it does not pulse as one block.
#
# Each group takes every 8th LED rather than a contiguous run, so neighbours
# are always in different groups and the variation reads as scattered along the
# length instead of banded. The periods share no small common multiple, so the
# groups drift apart and the pattern does not visibly repeat.
#
# Two layers per group: a static floor at 0.35 of the colour with the breathing
# layer 'add'ed on top at the remaining 0.65, so the peak still reaches full
# brightness. Both hold the same 1 : 0.4 : 0 ratio, so only brightness moves and
# the hue stays put.
#
# Layers are listed TOP FIRST -- _generateLayers does layers.insert(0, ...), so
# the config order is reversed and the last line is the bottom of the stack.
#
# Switched by _HBB_HEATER_LEDS in hbb_voron.cfg. Turning the strip white again
# needs only one call: drybox_idle covers every LED, and REPLACE=1 disables any
# effect sharing an LED with it.
#
# Deliberately NOT a 'heater' layer, which maps heater PROGRESS onto a gradient.
# That is useless here: the control thermistor sits on the PTC element and
# reaches target in ~30s, so the gradient would slam to its end while the box is
# still cold. Revisit once control moves to the air sensor -- see
# docs/drybox-air-control.md in the home-network repo.
[led_effect drybox_heating_1]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (1,9,17,25,33)
layers:
    breathing  2.6 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_2]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (2,10,18,26,34)
layers:
    breathing  3.1 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_3]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (3,11,19,27,35)
layers:
    breathing  3.7 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_4]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (4,12,20,28,36)
layers:
    breathing  2.9 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_5]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (5,13,21,29,37)
layers:
    breathing  4.1 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_6]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (6,14,22,30,38)
layers:
    breathing  3.3 1 add (0.65, 0.26, 0.0)
    static     0 0 top (0.35, 0.14, 0.0)

[led_effect drybox_heating_7]
autostart:              false
frame_rate:             24
leds:
    neopixel:drybox (7,15,23,31,39)
layers:
    breathing  2.7 1 add (0.65, 0.26, 0.0)
