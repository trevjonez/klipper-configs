# Chamber environment sensor on the Octopus's dedicated I2C header, which the
# silkscreen labels PB8=SCL / PB9=SDA -- matching klipper's i2c1a bus
# (BUS_PINS_i2c1a = "PB8,PB9", and struct i2c_info is {i2c, scl_pin, sda_pin}).
# Hardware I2C, no bitbang.
#
# NOTE that header supplies 3.3V, unlike the MMB's I2C header which is 5V. Do
# not carry that assumption between boards.
#
# PB6/PB7 (i2c1) would also have worked electrically but are taken: they are the
# BLTouch header, driving the Blobifier servo and bucket switch.
#
# Reports temperature, humidity and pressure. For drying, read DEW POINT rather
# than RH -- see docs/drybox-air-control.md in the home-network repo.
[temperature_sensor Chamber]
sensor_type: BME280
i2c_mcu: mcu
i2c_bus: i2c1a


#####################################################################
#   LED Control
#####################################################################

#[output_pin caselight]
#pin: 
#pwm: true
#shutdown_value: 0
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[gcode_macro _HOME_X]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.6 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    G28.1 X
    G91
    G1 X-10 F10000

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.6 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    G28.1 Y
    G91
    G1 Y-10 F10000

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if home_all or 'X' in params %}
      _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
      _HOME_Y
    {% endif %}
    {% if home_all or 'Z' in params %}
      BED_MESH_CLEAR
      G90
      G1 X175 Y175 F100000
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=100
      G28.1 Z
      G1 Z10
    {% endif %}

#[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position:175,175
#speed:100
#z_hop:10

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   15,10
   15,320
   340,320
   340,10
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01
max_adjust: 10

#--------------------------------------------------------------------
[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 15,25
mesh_max: 335,335
probe_count: 12,12
mesh_pps: 5,5
algorithm: bicubic

#####################################################################
#   Macros
#####################################################################

[gcode_macro G32]
gcode = 
	G90
	status_homing
	G28
	status_leveling
	QUAD_GANTRY_LEVEL
	status_homing
	G28
	status_meshing
	BED_MESH_CALIBRATE

[gcode_macro START_PRINT]
gcode = 
	{% set BED_TEMP = params.BED_TEMP|default(60)|float %}
	{% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
	{% set FIRST_Z = params.FIRST_Z|default(0.2)|float %}
	# Tap must happen COLD: a hot nozzle risks marking the PEI and oozing
	# onto the bed at the contact point.
	M117 Home & Probe
	G90
	status_homing
	G28
	status_leveling
	QUAD_GANTRY_LEVEL
	status_homing
	G28
	# Heat the BED only, then mesh hot so the mesh captures thermal expansion
	# and gantry/bed flex. The nozzle is held at a no-ooze standby because
	# BED_MESH_CALIBRATE scans at HORIZONTAL_MOVE_Z=1 -- any ooze lands on the bed.
	status_heating
	M117 Preheat
	PARK_SOAK
	M104 S150
	M190 S{BED_TEMP}
	status_meshing
	M117 Mesh (hot bed)
	BED_MESH_CALIBRATE
	# Full nozzle temp last, parked over the purge bucket so ooze is caught.
	status_heating
	PARK_PREHEAT
	M109 S{EXTRUDER_TEMP}
	#status_cleaning
	#PRIME_LINE FIRST_Z={FIRST_Z}
	#status_printing

[gcode_macro PRIME_LINE]
gcode = 
	{% set FIRST_Z = params.FIRST_Z|default(0.2)|float %}
	M117 Purging Nozzle
	G1 X2.0 Y2.0 F5000.0
	M106 S255
	G1 X7.0 Y2.0 Z{FIRST_Z} F5000.0
	M107
	G92 E0.0
	G1 E10 F600.0
	G92 E0.0
	G1 X62.0 Y2.0 E5 F600.0
	G92 E0.0
	G1 X262.0 Y2.0 E50 F600.0
	G1 X262.0 Y2.0 Z4.0 F10000.0
	G1 X250.0 Y2.0 Z2.0 F10000.0
	G92 E0.0
	M117

[gcode_macro END_PRINT]
gcode = 
	status_cooling
	M140 S0
	M104 S0
	M107
	G92 E0.0
	G1 E-1.0 F50000.0
	G92 E0.0
	PARK
	status_ready

[gcode_macro PARK]
gcode:
  MOVE_UP
  PARK_XY

[gcode_macro MOVE_UP]
gcode:
  GET_POSITION
  G1 Z{ [printer.gcode_move.gcode_position.z + 20,printer.configfile.config["stepper_z"]["position_max"]|float]|min } F5000.0
  UPDATE_DELAYED_GCODE ID=DELAY_GET_POSITION DURATION=4

[delayed_gcode DELAY_GET_POSITION]
gcode:
  GET_POSITION

[gcode_macro PARK_SOAK]
gcode = 
	# Same XY as PARK_PREHEAT (over the purge bucket) but high, to keep the
	# eddy coil away from the heating bed. Coil temperature shifts the frequency
	# table that scan-based meshing depends on, so soaking at Z10 biases the mesh.
	G1 X20 Y353 Z100 F4000.0

[gcode_macro PARK_PREHEAT]
gcode:
  G1 X20 Y353 Z10 F4000.0

[gcode_macro PARK_XY]
gcode:
  G1 X175 Y325.0 F4000.0

