[printer]
kinematics: corexy
max_velocity: 350  
# Startup default only. Klipper 0.13's set_max_velocities (toolhead.py:538) does
# NOT clamp M204 to this, so a sliced print overrides it within the first few
# hundred lines and this value never applies to printing -- it governs manual
# moves, homing, G32/QGL, and any gcode without an M204.
#
# 2500 was well under what the machine measured. SHAPER_CALIBRATE suggests
# <= 4600 for Y (mzv 39.4 Hz) and <= 5500 for X (3hump_ei 91.2 Hz), so Y is the
# binding axis at 4600. 4500 sits just inside it.
max_accel: 4500
# 60, set 2026-09-10 from accelerometer measurement, not calculation.
#
# History worth keeping, because the obvious reasoning is wrong twice over:
#   - 60 was tried earlier the same day and DROPPED STEPS. Cause was NOT the
#     rail, torque or accel: the Z steppers were auto -> silent, i.e. StealthChop
#     at every speed, and StealthChop runs out of PWM amplitude at 43.5 mm/s of
#     Z travel. 60 was 138% of that. Fixed by putting Z on tuning_goal:
#     autoswitch (see voron_autotune.cfg) -- crossover ~22 mm/s, SpreadCycle
#     above it.
#   - Note autotune LOGS that ceiling as "max PWM speed 217.36", which is in
#     rotation_distance units with the 5:1 gear ratio NOT applied. Divide by 5.
#
# Measured with the toolhead LIS2DW via ACCELEROMETER_MEASURE, 50mm Z moves,
# median of 3 runs, worst |Z accel| deviation:
#
#     20 mm/s   0.18 g        30 mm/s   0.50 g
#     40 mm/s   1.04 g   <- knee; rises steeply 20->40
#     45 mm/s   1.01 g        50 mm/s   1.09 g        60 mm/s   1.07 g
#
# The disturbance PLATEAUS above 40, so 45 buys nothing over 60 -- same thump,
# less speed. There is a real audible thump at move start (t=+9ms) above ~30
# mm/s, but it is vibration, not step loss.
#
# Accel is NOT a factor: at 60 mm/s, effective Z accel 100 / 175 / 350 gave
# 1.06 / 1.11 / 1.13 g -- a 3.5x range inside the run-to-run scatter. (Z accel
# can be tested at runtime without a restart: a pure Z move takes
# min(max_accel, max_z_accel), so SET_VELOCITY_LIMIT ACCEL=n lowers it.)
#
# Integrity: 27 Z moves including 12 at 60 mm/s, then QUAD_GANTRY_LEVEL
# converged on the FIRST pass at 0.0028 and 0.0081 against a 0.010 tolerance --
# the gantry never lost level. QGL retry count is the cheap skip detector; a
# skip on one of four Z steppers tilts the gantry.
#
# If you want Z quiet rather than fast, 30 is the value (0.50 g); below the knee.
#
# 48 V will not change any of this -- at 60 the rail is 47% used.
max_z_velocity: 60
# Left at 350 deliberately. At 60 mm/s the ramp is ~5 mm of a 150 mm park move,
# so accel buys almost nothing there; it would only matter for the 1 mm
# toolchange z-hops, worth ~0.04 s each at 1000.
max_z_accel: 350
square_corner_velocity: 5.0

