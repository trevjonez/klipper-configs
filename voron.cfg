#####################################################################
#      X/Y Stepper Settings
#####################################################################
#
# All six Octopus drivers are TMC5160 modules with a 0.075 ohm sense resistor,
# and the motor supply is 48 V as of 2026-09-24 (hardware/power.md). Neither
# fact appears as a parameter Klipper understands beyond sense_resistor -- the
# supply voltage is [autotune_tmc]'s business, see voron_autotune.cfg.
#
# sense_resistor was 0.110 on every one of these sections until 2026-09-24, and
# that was simply wrong: 0.110 is the 2209 value and these have never been
# 2209s. Klipper scales the current-scale bits by the sense resistor it is
# TOLD about, so a value 1.47x too high made every driver deliver 1.47x the
# current it was asked for:
#
#   X/Y   run_current 1.2  ->  1.76 A actually in the coils
#   Z*4   run_current 0.6  ->  0.88 A
#
# That matters more than bookkeeping: autotune computes PWM_OFS and the chopper
# hysteresis FROM run_current, so for as long as the two disagreed it was tuning
# a 1.2 A chopper onto a 1.76 A coil.
#
# X/Y therefore stay at run_current 1.2 and now actually GET 1.2 -- the 1.2 that
# was chosen on 2026-09-14 and never delivered. This is a real reduction from
# what the machine has been doing, and it is the point of the change: X/Y were
# running very hot even at standstill, which is exactly what 1.76 A predicts.
# There is no hold_current on any of these sections, so IHOLD = IRUN and a
# parked gantry dissipates the full run current as I^2R. 1.76 -> 1.2 A is
# (1.2/1.76)^2 = 0.47, i.e. a bit under half the standstill heat.
#
# hold_current is deliberately NOT the lever here. Reducing it on a CoreXY gives
# up holding torque against belt tension on the one axis pair that must not lose
# position, and it would not have fixed the cause, which was simply too much
# current.
#
# Z is a DIFFERENT DECISION and is still at the measured-equivalent 0.88 A, not
# the 0.6 it reads as intending. Z holds the whole gantry for an entire print,
# so dropping it to 0.6 trades heat against sag and skipped Z steps. Decide that
# on its own evidence; do not assume it follows from X/Y.
#
# Whatever is chosen, do not "fix" any of this by putting 0.110 back.

##  Connected to X-MOT (B Motor)
[stepper_x]
step_pin: DRIVER6_STEP
dir_pin: DRIVER6_DIR
enable_pin: !DRIVER6_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400
# Mechanical switch on the toolhead, wired to the EBB's P6 endstop port
# (net Endstop1 = gpio13): 10K pull-up to 5V, 1K + 22nF RC, then a
# 74LVC2G17 schmitt buffer. The switch HAS to be on the EBB -- there are no
# cable chains and the USB cable is the only line to the moving toolhead.
endstop_pin: ^!EBB:gpio13
# -1, measured 2026-09-16 by jogging. -5 was inherited and never verified.
#
# TOOLHEAD KEEP-OUT, front-left corner: X < 4 AND Y < 18.
# The Filametrix cutter arm hangs off the toolhead and sweeps that corner:
#   - entering on a DESCENDING X move can cut the filament
#   - entering on a DESCENDING Y move drives the cut lever's face into the
#     belt tensioner
# The edges are clear -- X4/Y0, X-1/Y18 and X4/Y18 were all jogged safely --
# it is the interior that bites.
#
# NOT ENFORCED. Klipper has no keep-out zones and this is a corner exclusion,
# not something position_min/max can express. Nothing currently targets it:
# the prime line starts at X8 Y2, and the homing backoffs land at X341/Y346.
# Any new macro that parks near the front-left has to respect it by hand.
position_min: -1
# 349.087, not 351, since the Cartographer CNC carriage swap (2026-09-25). Only
# the endstop switch moved -- toolhead, carriage-to-frame stop, bed and the
# Filametrix pin are all where they were relative to the nozzle -- so the fix
# is to put the trigger back in the SAME coordinate frame, not to re-derive
# everything else.
#
# Measured with the firmware rather than by eye: X/Y steppers disabled, carriage
# pushed by hand hard against the left stop, then G28 X with GET_POSITION step
# counters read before and after. Both CoreXY motors agreed to 0.000mm:
#   left stop -> switch trigger = 340.087mm travel + 10mm _HOME_X backoff
#                               = 350.087mm
# The left stop is -1 in this frame (position_min, measured by jogging 2026-09-16),
# so the trigger sits at -1 + 350.087 = 349.087. The switch now fires ~1.9mm
# earlier than before. Soft spot: if the 09-16 jog stopped a few tenths short
# of the true stop, this inherits that error -- it only matters for the
# Filametrix compressed position (X0.1, 1.1mm inside the stop).
#
# Repeat the measurement the same way if the switch or its strike surface is
# ever moved again: SET_STEPPER_ENABLE STEPPER=stepper_x/_y ENABLE=0, push to
# the left stop, GET_POSITION, G28 X, GET_POSITION, delta/320 + 10.
position_endstop: 349.087
position_max: 349.087
homing_speed: 50            # first touch; was 100 for sensorless SNR
second_homing_speed: 10     # slow re-touch, sets the real position
homing_retract_dist: 5      # was 0: sensorless could not re-touch
homing_positive_dir: true

[tmc5160 stepper_x]
interpolate: True
# 0.9 -> 1.2 (2026-09-14). 0.9 was 45% of this motor's 2.0A rating and a
# long fast travel to the first QGL point skipped -- no crash, just torque
# falling off against back-EMF at ~525rpm. Chopper mode was NOT the cause:
# autotune_tmc puts stepper_x/y in PERFORMANCE (SpreadCycle at all speeds)
# via its AUTO_PERFORMANCE_MOTORS name list, confirmed by GCONF en_pwm_mode=0.
# NOTE: sgt below was tuned at 0.9A and IS invalidated by this change.
run_current: 1.2
#stealthchop_threshold: 999999
#spi_bus: spi1
spi_software_sclk_pin: SPI_SCK
spi_software_mosi_pin: SPI_MOSI
spi_software_miso_pin: SPI_MISO
cs_pin: DRIVER6_CS
diag1_pin: ^!PG14
# driver_SGT: 0   # inert under autotune -- see sgt: in voron_autotune.cfg
sense_resistor: 0.075

##  Connected to Y-MOT (A Motor)
[stepper_y]
step_pin: DRIVER7_STEP
dir_pin: DRIVER7_DIR
enable_pin: !DRIVER7_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400
# Mechanical switch on the rear frame, Octopus STOP1 (PG9). Frame-mounted so
# nothing rides on the gantry. PG9 rather than STOP2-5: those share a net with
# the Z drivers' MOT<n>-DIAG<n> lines.
endstop_pin: ^!PG9
position_min: 0
# 356 (2026-09-16). The mechanical switch on the A-motor-mount bracket sits at
# the machine's effective safe maximum -- the gantry physically cannot go
# further back, so the frame cannot be shifted backward to chase alignment.
# Calling the trigger point 356 rather than 354 therefore buys 2mm of extra
# travel at the FRONT, which is the end that was short.
#
# This shifts every Y coordinate 2mm forward, including the blobifier's
# purge/brush line. That is corrected in the blobifier's own y_offset rather
# than here -- see mmu_macro_vars.cfg.
position_endstop: 356
# 356 -> 358 (2026-09-16). The switch triggers at 356 but the gantry has ~2mm
# of safe travel past it, measured by jogging. 356 left only 0.1mm of commanded
# headroom, which put the blobifier purge line 2mm forward of the tray.
#
# Blobifier follows this automatically: its position_y is
# pos_max.y - skew_correction - y_offset, so 358 moves the purge point from
# 355.9 to 357.9 with no change to its own vars. A negative y_offset could NOT
# have done this -- the computed target would exceed position_max and be
# rejected outright.
position_max: 358
homing_speed: 50            # first touch; was 100 for sensorless SNR
second_homing_speed: 10     # slow re-touch, sets the real position
homing_retract_dist: 5      # was 0: sensorless could not re-touch
homing_positive_dir: true

[tmc5160 stepper_y]
interpolate: True
# 0.9 -> 1.2 (2026-09-14). 0.9 was 45% of this motor's 2.0A rating and a
# long fast travel to the first QGL point skipped -- no crash, just torque
# falling off against back-EMF at ~525rpm. Chopper mode was NOT the cause:
# autotune_tmc puts stepper_x/y in PERFORMANCE (SpreadCycle at all speeds)
# via its AUTO_PERFORMANCE_MOTORS name list, confirmed by GCONF en_pwm_mode=0.
# NOTE: sgt below was tuned at 0.9A and IS invalidated by this change.
run_current: 1.2
#stealthchop_threshold: 999999
#spi_bus: spi1
spi_software_sclk_pin: SPI_SCK
spi_software_mosi_pin: SPI_MOSI
spi_software_miso_pin: SPI_MISO
cs_pin: DRIVER7_CS
diag1_pin: ^!PG15
# driver_SGT: 0   # inert under autotune -- see sgt: in voron_autotune.cfg
sense_resistor: 0.075

#####################################################################
#   Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: DRIVER5_STEP
dir_pin: DRIVER5_DIR
enable_pin: !DRIVER5_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
##  In Z- Position
endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
# position_endstop: -0.5
position_max: 310
position_min: -50
homing_speed: 20   # scan-home descent from an unknown height; the plugin caps it at ~33 mm/s (worst-case stop within the 2 mm trigger height). Touch then sets zero at 1 mm/s.
second_homing_speed: 3
homing_retract_dist: 0   # Cartographer plugin requirement (was 3 under the Eddy)

[tmc5160 stepper_z]
interpolate: True
run_current: 0.88
# hold_current: Z motors hummed and their shafts jittered while holding at full
# current (48 V SpreadCycle, holding the gantry against belt tension), worst on
# whichever corner stopped at an unlucky microstep. StealthChop-at-standstill
# only partly helped; 0.6 A hold fixed it (2026-09-26). The rotor settles a few
# um differently under load at hold vs full current, so Z zero is only consistent
# because this is ALWAYS in effect: a home at 0.88 A hold measured +9.7 um after
# switching to 0.6 A, and a home at 0.6 A measured +0.8 um. Touch accuracy at 0.6:
# sigma 0.6-1.0 um. Autotune does not touch ihold.
hold_current: 0.6
#stealthchop_threshold: 999999
#spi_bus: spi1
spi_software_sclk_pin: SPI_SCK
spi_software_mosi_pin: SPI_MOSI
spi_software_miso_pin: SPI_MISO
cs_pin: DRIVER5_CS
#diag1_pin: PG13
sense_resistor: 0.075

