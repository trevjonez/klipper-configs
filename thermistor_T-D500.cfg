# As desribed from aliexpress:
# https://www.aliexpress.com/item/4000907614466.html
# Trianglelab T-D500 Temperature Sensor 500℃ high temperature 3D printing for volcano E3D V6 HOTEND PEI PEEK Nylon carbon fiber

# This is an e3d v6 cartridge style thermal probe that has a nice spring wrapped exit point for the wiring 

# The 200C and 300C points are Trianglelab's own published values and are exact.
# The low point was hand-made years ago and was the only invented number: it had
# 20C = 3.649M against the vendor's R25 = 4.721M (R20 would be ~6.0M), i.e. ~40%
# low, which dragged the cubic term and made room temperature read ~10C cold.
# Replaced 2026-09-13 with the vendor's R25. Fitted against the full vendor
# table the result is within ~1C from 150-300C and fixes the cold end.
#
# Note the sensor is genuinely blind near ambient regardless of curve: at 25C the
# divider sits ~4 counts off rail on a 12-bit ADC, so expect several degrees of
# jitter down there. That is quantization, not the table.
[thermistor T-D500]
temperature1: 25
resistance1: 4721000
temperature2: 200
resistance2: 8000
temperature3: 300
resistance3: 1092
