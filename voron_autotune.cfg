# TMC autotune -- https://github.com/andrewmcgr/klipper_tmc_autotune
#
# Plan, rationale and validation steps: home-network/docs/voron-tmc-autotune.md
# Reviewed against plugin commit b6c7cfa9 (which is also what is installed).
#
# PHASE 1: X, Y, Z, Z1, Z2, Z3, extruder.
# PHASE 2 (2026-09-08): stepper_mmu_gear and stepper_mmu_selector added below,
#   on fitting the LDO-42STH20-1004ASH pair. The stealthchop_threshold lines in
#   mmu/base/mmu_hardware.cfg were commented out in the SAME change, which is the
#   required order: the selector's threshold was load-bearing until an
#   [autotune_tmc] section existed to take over its mode decision.
#
#   NOT done here, deliberately: raising the gear run_current from 0.5 A toward
#   0.7-0.8 A. The plan doc calls for that as a separate load-tested step, not
#   in the same restart as everything else. See "Phase 2: the MMU".
#
# Autotune never writes through SAVE_CONFIG, so these sections are safe in an
# include (unlike [probe_eddy_current] -- see hosts/voron.md on
# _disallow_include_conflicts).
#
# NOTE: voltage is stated explicitly on every section even though 24 IS the
# plugin default (autotune_tmc.py:174). Nothing on the machine measures the rail,
# so the default is an assumption wearing no label -- and it feeds PWM_OFS,
# PWM_GRAD, the chopper hysteresis and every velocity threshold. Writing it down
# makes the assumption reviewable and gives a 48 V conversion exactly nine lines
# to change. See the supply-voltage section of the plan doc.
#
# One caveat if that ever happens: maxpwmrps (motor_constants.py:36) calls
# pwmgrad POSITIONALLY and so drops volts, falling back to 24 -- the registers
# come out right but TPWMTHRS/THIGH do not. Patch that before trusting 48.
#
# NOTE: run_current is an input to every value autotune computes, and nothing
# recomputes when it changes. Any SET_TMC_CURRENT after startup silently
# invalidates the tuning for that stepper -- which is why the current reduction
# came out of _HOME_X / _HOME_Y.

# A/B: LDO-42STH48-2004MAH, 0.9 deg / 400 steps. The 48mm part, label-confirmed
# -- the 40mm 42STH40 would feed 1.1ohm/2.8mH/0.35Nm instead of 1.4/2.0/0.44.
# No tuning_goal needed: both are in AUTO_PERFORMANCE_MOTORS.
# sgt: lives HERE, not in [tmc5160]. driver_SGT there is overwritten on every
# tune, with no error and no effect -- a silent failure mode.
# sgt tuned empirically 2026-09-04 at homing_speed 80 and the full 0.9 A
# (the _HOME_X/_HOME_Y current reduction was removed for this). X results,
# all measured COLD:
#    1  no trigger at all -- gantry crashed and ground
#   -5  triggers, hard impact
#   -6  triggers, softer
#   -7  same as -6
#   -8  same again
#   -9  too sensitive
#  -10  too sensitive
# So X's cold band is -8..-5, with impact force flat across -6..-8.
#
# -8 was chosen first and FAILED HOT: after a heat-soaked print it triggered
# early. -8 sat on the sensitive edge of the cold band -- one step from the -9
# that failed -- so it had no margin left for a thermal shift. Chamber heat
# changes belt tension and bearing preload, which changes the load signature
# StallGuard reads, so the band measured cold is not the band when soaked.
# -7 is the middle of the cold band and holds both cold and hot: that margin
# on BOTH sides is the point, not the specific number.
#
# Y stays at -8 while X is at -7. The axes deliberately do NOT match, because
# they fail in OPPOSITE directions.
#
# Y was moved to -7 alongside X on 2026-09-05 and reverted the same day: at -7
# the home skipped a few steps before StallGuard fired. That is the
# too-insensitive failure -- the motor was already losing position by the time
# the stall registered. -8 homes cleanly on Y both cold and heat-soaked.
#
# So X's cold band does not transfer to Y, which was always the risk: Y moves
# the whole gantry rather than just the toolhead, so it presents a different
# load signature. X had to move AWAY from the sensitive edge to survive heat;
# Y has to sit ON it to trigger at all. Y's own band has still never been
# swept -- if -8 ever fails hot on Y the way it did on X, sweep Y directly
# (cold, homing_speed 80, full current) rather than borrowing another number
# from X.
[autotune_tmc stepper_x]
motor: ldo-42sth48-2004mah
voltage: 24
sgt: -7

[autotune_tmc stepper_y]
motor: ldo-42sth48-2004mah
voltage: 24
sgt: -8

# Z: LDO-42STH48-2004AC. auto -> silent at 0.59 Nm, which is what we want.
# Database says 1.6ohm where the LDO drawing says 1.4 +/-20%; inside tolerance,
# torque and inductance match exactly, so the entry is fine as-is.
[autotune_tmc stepper_z]
motor: ldo-42sth48-2004ac
voltage: 24

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2004ac
voltage: 24

[autotune_tmc stepper_z2]
motor: ldo-42sth48-2004ac
voltage: 24

[autotune_tmc stepper_z3]
motor: ldo-42sth48-2004ac
voltage: 24

# Extruder: LDO-36STH20-1004AHG. auto -> PERFORMANCE, not silent: the README
# advice of "silent for the extruder" carries an "unless the motor is very
# small" caveat, and 0.10 Nm is very small. So the toolhead runs SpreadCycle and
# will be no quieter than before. Correct for high flow, not a misconfiguration.
# Set tuning_goal: silent here if quiet ever matters more than consistency.
[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
voltage: 24

# MMU gear + selector: LDO-42STH20-1004ASH, fitted 2026-09-08, replacing a Moons
# MS17HD5P4100 (gear) and a FYSETC 42HS20401B-20-0.5R (selector). 7.2 ohm /
# 7.0 mH / 0.18 Nm / 1.0 A / 200 steps, which is what the database carries.
#
# tuning_goal is explicit on both rather than left to auto (auto lands on
# performance at 0.18 Nm, but via a torque cutoff that says nothing about these
# axes). autoswitch rather than performance, changed 2026-09-08 after performance
# made the SELECTOR hiss at standstill: it had carried stealthchop_threshold: 100
# for years, so it was StealthChop below 100 mm/s including at rest, and
# performance writes tpwmthrs=0xFFFFF + en_spreadcycle, i.e. SpreadCycle even
# while parked and energised at hold current. autoswitch restores a quiet
# standstill without giving up SpreadCycle where the torque is actually needed.
#
# The computed crossovers, against Happy Hare's own speeds:
#
#   gear      StealthChop below  7.1 mm/s filament  (ceiling 35 mm/s)
#             synced printing  ~1.6 mm/s -> StealthChop, and that is the axis's
#             whole duty cycle for hours at a time
#             homing 50 / spool+unload 80 / buffer 150 -> all SpreadCycle
#   selector  StealthChop below 47 mm/s   (ceiling 233 mm/s)
#             standstill -> StealthChop; homing 60 and moves 120 -> SpreadCycle
#
# So every bowden move and every gate move keeps SpreadCycle, and the 0.5 -> 0.7 A
# gear increase is untouched where it was aimed. What changes is the quiet: the
# gear during synced printing, and both motors at rest.
#
# autoswitch is marked EXPERIMENTAL in autotune_tmc.py:86. It is also the only
# goal whose behaviour depends on TPWMTHRS, which maxpwmrps computes from a
# hardcoded 24 V -- inert here because the rail IS 24, a trap at 48.
#
# run_current stays where it is in mmu_hardware.cfg (gear 0.5 A, selector 0.8 A).
# Both old and new motors are 1.0 A rated, so those values survived the swap
# unchanged -- and autotune recomputes nothing if they are altered later, so
# raising the gear current is its own deliberate step.
# GEAR: autoswitch. The plan doc says performance, and its REASONING holds --
# every bowden move the axis makes (homing 50, spool/unload 80, buffer 150 mm/s
# filament) is above its ~35 mm/s StealthChop ceiling, so those moves must be
# SpreadCycle. autoswitch keeps them there: it sets tpwmthrs at ~7 mm/s filament,
# so everything above that is SpreadCycle exactly as performance would be. What
# it adds is a quiet standstill, which performance cannot give because it writes
# SpreadCycle even while parked and energised.
#
# Chosen 2026-09-08, AFTER a broken solder joint on one gear phase was found and
# repaired -- so unlike the first attempt at autoswitch that evening, this is a
# judgement about noise from a motor with all four wires connected. (The fault
# showed as ola=1 OpenLoad_A plus a pwm_grad_auto of 39 against the selector's
# 20; a buzz was not enough motion to expose it, it took a 100 mm move.)
#
# The one thing to watch: synced printing sits at ~1.6 mm/s filament, BELOW the
# crossover, so the spool-dragging duty the axis was sized for now runs in
# StealthChop. At 0.3 rev/s that is essentially DC and well inside what
# StealthChop regulates -- but if bowden loads or synced feeding ever falter,
# performance is one word away and is the documented fallback.
#
# autoswitch is marked EXPERIMENTAL in autotune_tmc.py:86, and is the only goal
# whose behaviour depends on TPWMTHRS -- which maxpwmrps computes from a
# hardcoded 24 V. Inert here because the rail IS 24; a trap at 48.
[autotune_tmc stepper_mmu_gear]
motor: ldo-42sth20-1004ash
voltage: 24
tuning_goal: autoswitch

# SELECTOR: silent, 2026-09-08. StealthChop everywhere, including its moves.
# Safe here and NOT safe on the gear, for one reason -- headroom:
#
#   selector  StealthChop ceiling 233 mm/s vs selector_move_speed 120,
#             selector_homing_speed 60   -> both comfortably under. Fine.
#   gear      StealthChop ceiling  35 mm/s filament vs gear_from_buffer 150,
#             spool/unload 80, homing 50 -> all ABOVE it. Not fine.
#
# So the selector can run StealthChop end to end; the gear cannot, and is on
# performance above. Kept at silent through the 2026-09-08 gear cable fault,
# because the standstill hiss it fixes was the selector's own and unrelated:
# performance writes SpreadCycle even while parked, which is what stealthchop_
# threshold: 100 used to prevent.
[autotune_tmc stepper_mmu_selector]
motor: ldo-42sth20-1004ash
voltage: 24
tuning_goal: silent
