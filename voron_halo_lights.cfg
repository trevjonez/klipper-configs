# WS2812B, finer pitch than the strip this replaced. 334 LEDs total.
#
# Per-side split is UNVERIFIED. Scaling the old 92 (24b, 22r, 24f, 22l) by
# 334/92 gives roughly 87b, 80r, 87f, 80l, which sums to exactly 334 -- but
# that is inferred from the ratio, not counted. Verify before trusting it.
#
# 334 exceeds stock Klipper. neopixel.py caps chain_count * len(color_order)
# at MAX_MCU_SIZE, and GRB is 3 bytes per pixel, so the stock 500 allows only
# 166 LEDs. Requires klipper-patches/0003, which raises the cap to 1024.
# Without that patch this section fails at parse with "neopixel chain too
# long". Splitting the strip is not an escape: two chains top out at 332, and
# an even split is 167 each = 501 bytes, one over. It would take four.
#
# There is no LED-type option in [neopixel]. color_order is the only thing that
# encodes the part: GRB is correct for WS2812B, which is RGB only -- no white
# channel, so no initial_white here. If colours come out swapped (red showing
# green), color_order is the line to change.
#
# BRIGHTNESS IS DELIBERATELY LOW. WS2812B draw ~60 mA each at full white, so
# 334 of them at 1.0 is ~20 A at 5 V -- about 5 A off the 24 V rail through the
# buck, against an 8.8 A supply whose budget in hardware/power.md is already
# estimated at 7-11 A peak. 0.2 puts it near 4 A at 5 V, ~1 A on the rail.
# Do not raise this without redoing that budget.
[neopixel halo]
pin = PB0
chain_count = 334
color_order = GRB
initial_red = 0.2
initial_green = 0.2
initial_blue = 0.2
