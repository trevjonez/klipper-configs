# Halo: 16x WS2814, RGBW.
#
# Replaces the 334-LED WS2812B run that was written into this file but never
# actually installed -- see b302fd1, "checkin light edits/patch while waiting
# for new LED strip to arive". None of the 334-era reasoning survived the part
# change, so this file was rewritten rather than amended.
#
# COLOR ORDER IS WRGB, AND THIS WAS MEASURED, NOT GUESSED. On 2026-09-06 each
# of the four wire bytes was driven on its own and the strip photographed with
# the chamber webcam, differenced against an all-off frame:
#
#   byte 1 -> broadband, cool-white (R .44 G .87 B 1.0)  = W
#   byte 2 -> R 1.00  G -.05  B  .09                     = R
#   byte 3 -> R  .05  G 1.00  B  .46                     = G
#   byte 4 -> R -.07  G  .05  B 1.00                     = B
#
# White first. That is the WS2814A die. Note the plain WS2814 datasheet shows
# RGBW while the WS2814A shows WRGB, and both PDFs carry the same stale caption
# claiming RGBW -- so the vendor text cannot settle it and the strip has to be
# tested. If this strip is ever swapped for another "WS2814", re-run the test.
#
# DO NOT use the magenta/cyan/yellow check from stealthburner_leds.cfg on this
# part. It assumes the chip is one of GRBW/RGBW/BRGW and cannot represent WRGB:
# a WRGB chip and a BRGW chip both come out yellow under it, and its prescribed
# fix for yellow (BRGW) is wrong here. Drive one byte at a time instead.
#
# Lit from the white die alone -- RGB at 0 rather than mixing white from three
# coloured dies. That is the reason to run RGBW at all: the phosphor white has
# much better CRI than an RGB mix, and driving both would roughly double the
# draw for a worse-looking white. Set the RGB channels if you want a tint.
#
# WS2814 IS A 12 V / 24 V PART -- there is no 5 V version. The WS2812B it
# replaced was 5 V, so this is a different rail. chain_count counts driver ICs,
# not visible LEDs: at 12 V each IC drives three LEDs in series, so 16 here can
# be 48 diodes on the strip. Count ICs when changing it.
#
# Data-line logic is marginal by spec and worth remembering if it ever glitches:
# VIH is 0.7*VDD, about 3.5 V at 5 V VDD, and PB0 drives 3.3 V. It works here,
# but a level shifter is the correct fix rather than a longer data run.
#
# Stock Klipper is sufficient: 16 x 4 = 64 bytes, well under neopixel.py's
# MAX_MCU_SIZE of 500. klipper-patches/0003 raised that cap for the 334-LED
# plan and was reverted on 2026-09-06; see klipper-patches/README-0003.md.
#
# Brightness is no longer power-constrained. The old 0.2 existed because 334
# WS2812B at full white is ~20 A at 5 V, against a budget already estimated at
# 7-11 A peak. 16 ICs is nowhere near any limit in hardware/power.md, so 0.2 is
# now taste, not a ceiling -- raise it freely.
[neopixel halo]
pin = PB0
chain_count = 16
color_order = WRGB
initial_red = 0.0
initial_green = 0.0
initial_blue = 0.0
initial_white = 0.2
