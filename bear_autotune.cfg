# TMC autotune for the Bear MK3 fleet (mk3-1, mk3-2, mk3-3).
# Mirrors voron_autotune.cfg. See home-network docs/voron-tmc-autotune.md.

# LDO-42STH34-1004L321E(Tr82) -- the Z motors.
#
# This is a LINEAR stepper (external drive, integrated Tr8x2 leadscrew). LDO
# specs it by axial push force, so BOTH stock motor_database.cfg entries are
# unusable as written:
#   ldo-42sth34-1004l321e           holding_torque: 107.7  <- that is the push
#                                   force in NEWTONS (11 kg / 107.8 N).
#   ldo-42sth34-1004l321e(prusa-z)  holding_torque: 0.59   <- unsourced, but as
#                                   it turns out roughly right.
#
# R and L are verbatim from LDO drawing Rev A (2019-01-16); both stock entries
# already have those correct.
#
# holding_torque here is EMPIRICAL, not from the datasheet. Do not try to derive
# it from the 107.8 N push force -- that is a rated working load, not a stall
# figure, and dividing it through the screw understates torque about 5x. It was
# measured instead: mk3-2 runs the identical motor without autotune, and its
# driver converged pwm_autograd to pwm_grad_auto=25 over days of running. Back
# through autotune's own formula,
#   pwmgrad = ceil(cbemf * 2*pi*fclk*1.46 / (V*256*steps)), cbemf = T/(2*Imax)
# pwm_grad 25 at 24 V / 200 steps implies T ~= 0.53 Nm. Seeding that makes
# mk3-1 start where mk3-2 empirically ended up.
[motor_constants ldo-42sth34-1004l321e-tr82]
resistance: 8.0
inductance: 0.0095
holding_torque: 0.53
max_current: 1.0
steps_per_revolution: 200

# X/Y: sgt carries over the old driver_SGT: 2 as a starting point. Validated
# good at full run_current (0.55 A) 2026-09-18. Setting SGT anywhere outside
# this section is silently ignored by autotune.
# No tuning_goal: these are in AUTO_PERFORMANCE_MOTORS and pick performance.
[autotune_tmc stepper_x]
motor: ldo-42sth40-1684mac
sgt: 2

[autotune_tmc stepper_y]
motor: ldo-42sth40-1684mac
sgt: 2

# Z: semin: 0 disables CoolStep, and that is REQUIRED on this machine.
#
# autotune sets tcoolthrs = COOLSTEP_THRS_FACTOR * rotation_distance
# (0.75 * 2 = 1.5 mm/s here), so with these 2 mm-lead screws CoolStep engaged
# below every Z move we make -- max_z_velocity is 5 mm/s. The resulting current
# hunting was clearly audible against mk3-2, and it also PREVENTED the
# StealthChop gradient autotuner from converging: after 480 mm of travel
# pwm_ofs_auto tracked (59->61) while pwm_grad_auto stayed pinned at its seed.
# The Voron never hits this only because its Z rotation_distance is 40, putting
# the same threshold at 30 mm/s, well above its Z speeds.
#
# tuning_goal is explicit rather than auto: it forces tpwmthrs=0 (StealthChop at
# all velocities), which matches the stealthchop_threshold: 999999 these ran
# with before autotune.
[autotune_tmc stepper_z]
motor: ldo-42sth34-1004l321e-tr82
tuning_goal: silent
semin: 0

[autotune_tmc stepper_z1]
motor: ldo-42sth34-1004l321e-tr82
tuning_goal: silent
semin: 0

# Extruder resolves to performance (0.20 Nm is under autotune's 0.3 gate).
# Expected for a small motor -- not a misconfiguration.
[autotune_tmc extruder]
motor: ldo-42sth25-1404mac

# Z StealthChop rescue -- this is load-bearing, do not drop it.
#
# autotune always sets tcoolthrs = COOLSTEP_THRS_FACTOR * rotation_distance
# (_setup_coolstep, unconditional, no config option). With these 2 mm-lead
# screws that is 0.75 * 2 = 1.5 mm/s. StallGuard2 requires SpreadCycle, so the
# moment TSTEP enters the StallGuard window the TMC5160 DROPS StealthChop --
# every Z move above 1.5 mm/s ran SpreadCycle, which is what you hear.
#
# semin: 0 above is NOT sufficient on its own: it disables the CoolStep current
# scaling but leaves tcoolthrs set, and tcoolthrs is what forces SpreadCycle.
#
# Measured on mk3-1 2026-09-18, DRV_STATUS bit 14 during motion:
#   tcoolthrs=313 (1.5 mm/s):  1 mm/s stealth=1 | 5 mm/s stealth=0 (SpreadCycle)
#   tcoolthrs=0:                                  5 mm/s stealth=1 (StealthChop)
#
# Safe because Z does not use sensorless homing -- it homes on
# probe:z_virtual_endstop -- so nothing on this axis needs StallGuard.
# Fires after the autotune klippy:ready handler, which is what sets tcoolthrs.
[delayed_gcode bear_z_stealthchop]
initial_duration: 3
gcode:
    SET_TMC_FIELD STEPPER=stepper_z FIELD=tcoolthrs VALUE=0
    SET_TMC_FIELD STEPPER=stepper_z1 FIELD=tcoolthrs VALUE=0
